# This crate owns the embedded SvelteKit frontend assets via rust-embed.
# It exists as a workspace member so that:
# 1. release-plz detects frontend commits and bumps this crate's version, which
#    cascades to `uptrakit-controller` (which has `frontend` as an optional dep).
# 2. `changelog_include = ["frontend"]` in the controller's release-plz config
#    merges frontend commit text into the controller's changelog.
# See https://github.com/release-plz/release-plz/issues/1581
[package]
name = "uptrakit-frontend"
description = "Uptrakit frontend assets crate (embeds built SvelteKit bundle)"
version = "0.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# build.rs copies `frontend/build/` (gitignored) to `$OUT_DIR/embed/` so that
# rust-embed reads from a per-build path. release-plz's git_only baseline
# worktree has no `build/`; build.rs falls back to embedding a stub.
include = [
    "src/**/*",
    "build.rs",
    "Cargo.toml",
]

[dependencies]
rust-embed = { workspace = true, features = ["mime-guess", "interpolate-folder-path"] }

[lints]
workspace = true
