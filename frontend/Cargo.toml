# This package has no Rust source and is never published or released.
# It exists solely to make `frontend/` a Cargo workspace member so that
# release-plz can attribute frontend commits to `uptrakit-controller` via
# `changelog_include = ["frontend"]`. Without a Cargo.toml here,
# release-plz has no way to associate a non-crate directory with a package's
# change detection — see https://github.com/release-plz/release-plz/issues/1581.
[package]
name = "frontend"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
autolib = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = ".cargo-stub.rs"
