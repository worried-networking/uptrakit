# Allowlist for ci/verify_no_orphan_modules.py.
# Every entry MUST carry a non-empty `reason`. Entries are exact repo-relative
# paths (Class A) or "file::mod_name" declaration ids (Class B).
# Paths under ci/testdata/ are excluded from the scan entirely and must never
# be allowlisted here (a ci/testdata/ entry is reported as a stale path).

