[workspace]
resolver = "3"
members = [
    "crates/*/*",
]

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Andrey Yantsen"]
repository = "https://github.com/worried-networking/uptrakit"
version = "0.0.1"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
rootcause = "0.11"
thiserror = "2"
ipnet = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "x509-parser", "aws_lc_rs"] }
x509-parser = { version = "0.18", default-features = false, features = ["verify-aws", "verify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
http = "1"
time = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sea-orm = { version = "2.0.0-rc.30", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-time", "with-uuid"] }
uuid = { version = "1.20", features = ["v7"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
