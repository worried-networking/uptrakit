[workspace]
resolver = "3"
members = [
    "crates/*/*",
]

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Andrey Yantsen"]
repository = "https://github.com/worried-networking/uptrakit"
version = "0.0.1"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive", "env"] }
rootcause = "0.11"
thiserror = "2"
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["pem", "x509-parser", "aws_lc_rs"] }
x509-parser = { version = "0.18", default-features = false, features = ["verify-aws", "verify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http = "1"
time = { version = "0.3", features = ["formatting"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sea-orm = { version = "2.0.0-rc.30", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-time", "with-uuid", "with-json"] }
url = "2"
uuid = { version = "1.20", features = ["v7", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.9"
hostname = "0.4"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
utoipa = { version = "5.4", features = ["uuid"] }
x509-ocsp = "0.2"
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
spki = { version = "0.7", features = ["alloc"] }
x509-cert = { version = "0.2", default-features = false }
const-oid = { version = "0.9", features = ["db"] }
aws-lc-rs = "1"
strum = { version = "0.27", features = ["derive"] }
regex = "1"
semver = "1"
tokio-util = "0.7"
async-trait = "0.1"
uptrakit-shared-macros = { path = "crates/shared/macros" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
