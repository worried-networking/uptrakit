[workspace]
resolver = "3"
members = [
    "crates/core/*",
    "crates/shared/*",
    "crates/ui/*",
    "crates/plugins/*/*",
    "crates/plugins/hooks/*",
    "crates/plugins/notifications/*",
    "frontend",
    "xtask",
]

[workspace.package]
description = "Agent-based update tracking toolkit for self-hosted Linux environments"
license = "MIT OR Apache-2.0"
authors = ["Andrey Yantsen"]
repository = "https://github.com/worried-networking/uptrakit"
edition = "2024"
# Named fake registry: cargo refuses publish to crates.io while keeping
# workspace publish settings homogeneous so `cargo package --workspace`
# (used by release-plz git_only mode) can build a temp registry that
# resolves all internal path deps.
publish = ["uptrakit-private"]

[workspace.dependencies]
# Version pinned here; features declared per-crate.
tokio = { version = "1" }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive", "env", "string"] }
rootcause = "0.13"
thiserror = "2"
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["pem", "x509-parser", "aws_lc_rs"] }
x509-parser = { version = "0.18", default-features = false, features = ["verify-aws"] }
parking_lot = "0.12"
rmcp = { version = "3.1", features = ["transport-streamable-http-server"] }
schemars = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tower = { version = "0.5", features = ["util"] }
vt100 = { version = "0.16" }
http = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-well-known"] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio", "macros", "with-time", "with-uuid", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio"] }
url = "2"
uuid = { version = "1" }
# rand 0.10 is already in the graph via async-nats 0.50, russh 0.62 and sqlx-postgres 0.9, so the
# workspace pin tracks it rather than adding a duplicate. rand 0.9 remains for bollard/tungstenite
# and rand 0.8 for openidconnect; neither is reachable from first-party code.
rand = "0.10"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
hostname = "0.4"
sha2 = "0.11"
hex = "0.4"
subtle = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
arc-swap = "1.9.2"
metrics = "0.24"
metrics-util = "0.20"
moka = "0.12"
utoipa = { version = "5.5", features = ["uuid"] }
x509-ocsp = "0.2"
# der/spki/const-oid/x509-cert move as one RustCrypto unit and stay at 0.7/0.7/0.9/0.2
# (latest: 0.8/0.8/0.10/0.3). Two independent gates, both already at their newest release:
#   - x509-ocsp 0.2.1 requires der ^0.7.8, spki ^0.7.2, x509-cert ^0.2.4
#   - openidconnect 4.0.1 → rsa/ecdsa → pkcs8 0.10 → spki 0.7 → der 0.7
der = { version = "0.7", features = ["alloc", "derive", "oid", "pem"] }
spki = { version = "0.7", features = ["alloc"] }
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }
const-oid = { version = "0.9", features = ["db"] }
aws-lc-rs = "1"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1" }
regex = "1"
semver = "1"
tokio-stream = "0.1"
tokio-util = "0.7"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
async-stream = "0.3"
async-trait = "0.1"
# bollard held at 0.20 (latest: 0.21.1). The blocker is testcontainers-modules, not testcontainers:
# testcontainers-modules 0.15.0 (latest) requires testcontainers ^0.27.0, and testcontainers 0.28.0
# requires bollard ^0.21.0 — so the dev stack cannot reach bollard 0.21 until modules accepts
# testcontainers 0.28. Bumping the docker plugin alone would fork the graph into prod-0.21/dev-0.20.
# Revisit when testcontainers-modules ships a release accepting testcontainers 0.28.
bollard = { version = "0.20", default-features = false, features = ["http", "pipe"] }
tempfile = "3"
cargo_metadata = "0.23.1"
# tokio-tungstenite stays at 0.29 (latest: 0.30.0) — axum 0.8.9 (latest) requires ^0.29.0;
# bumping would fork the graph into two incompatible tungstenite stacks. The type is also viral:
# service-sdk's public EnrollmentError wraps tungstenite::Error, so a bump recompiles 11 crates.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
zeroize = { version = "1", features = ["derive"] }
async-nats = { version = "0.50", default-features = false, features = ["server_2_10", "server_2_11", "server_2_12", "aws-lc-rs", "jetstream"] }
# base64 0.23 gains a default `simd-unsafe` feature; keep it off — first-party use is config-sized
# payloads where the `unsafe` SIMD path buys nothing.
base64 = { version = "0.23", default-features = false, features = ["std"] }
rustix = { version = "1", default-features = false }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
serde_yaml_ng = "0.10"
uptrakit-frontend = { path = "frontend", version = "0.0.6" }
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
uptrakit-shared-macros = { path = "crates/shared/macros", version = "0.0.2" }
uptrakit-shared-types = { path = "crates/shared/types", version = "0.0.3" }
uptrakit-openapi-client = { path = "crates/shared/openapi-client", version = "0.0.4" }
uptrakit-command = { path = "crates/shared/command", version = "0.0.1" }
uptrakit-plugin-infrastructure-core = { path = "crates/plugins/infrastructure/core", version = "0.0.3" }
uptrakit-global-github-provider = { path = "crates/shared/global-github-provider", version = "0.0.1" }
uptrakit-github-client = { path = "crates/shared/github-client", version = "0.0.1" }
uptrakit-plugin-package-manager-pkg = { path = "crates/plugins/package-managers/pkg", version = "0.0.3" }
uptrakit-plugin-infrastructure-registry = { path = "crates/plugins/infrastructure/registry", version = "0.0.3", default-features = false }
# Internal crates (all must be referenced via workspace = true in member Cargo.toml files)
uptrakit-agent-core = { path = "crates/shared/agent-core", version = "0.0.3" }
uptrakit-agent-runtime = { path = "crates/core/agent-runtime", version = "0.0.5", default-features = false }
uptrakit-agent-ssh = { path = "crates/core/agent-ssh", version = "0.0.7", default-features = false }
uptrakit-agent-ssh-runtime = { path = "crates/core/agent-ssh-runtime", version = "0.0.6", default-features = false }
uptrakit-mqtt-runtime = { path = "crates/core/mqtt-runtime", version = "0.0.5", default-features = false }
uptrakit-controller-core = { path = "crates/ui/controller-core", version = "0.0.3" }
uptrakit-controller-runtime = { path = "crates/core/controller-runtime", version = "0.0.4", default-features = false }
uptrakit-crypto = { path = "crates/shared/crypto", version = "0.0.1" }
uptrakit-shared-db = { path = "crates/shared/db", version = "0.0.1", default-features = false }
uptrakit-directories = { path = "crates/shared/directories", version = "0.0.1" }
uptrakit-zeroconf = { path = "crates/shared/zeroconf", version = "0.0.3" }
uptrakit-web-api-types = { path = "crates/shared/web-api-types", version = "0.0.4" }
uptrakit-nats = { path = "crates/shared/nats", version = "0.0.1" }
uptrakit-scheduler-runtime = { path = "crates/core/scheduler-runtime", version = "0.0.5", default-features = false }
uptrakit-tracing-init = { path = "crates/shared/tracing-init", version = "0.0.1", default-features = false }
uptrakit-service-sdk = { path = "crates/shared/service-sdk", version = "0.0.4", default-features = false }
uptrakit-service-platform = { path = "crates/shared/service-platform", version = "0.0.1" }
uptrakit-notification-plugin-core = { path = "crates/plugins/notifications/core", version = "0.0.2" }
uptrakit-notification-plugin-webhook = { path = "crates/plugins/notifications/webhook", version = "0.0.3" }
uptrakit-notification-plugin-telegram = { path = "crates/plugins/notifications/telegram", version = "0.0.3" }
uptrakit-notification-plugin-email = { path = "crates/plugins/notifications/email", version = "0.0.3" }
uptrakit-notification-delivery = { path = "crates/plugins/notifications/delivery", version = "0.0.3" }
uptrakit-service-connections = { path = "crates/ui/service-connections", version = "0.0.2" }
uptrakit-surface-proxy = { path = "crates/ui/surface-proxy", version = "0.0.3", default-features = false }
uptrakit-config-merge = { path = "crates/shared/update-hooks", version = "0.0.1" }
uptrakit-config-reload = { path = "crates/shared/config-reload", version = "0.1.0" }
uptrakit-wire = { path = "crates/shared/wire", version = "0.0.3" }
uptrakit-surfaces = { path = "crates/shared/surfaces", version = "0.0.3" }
uptrakit-tenant-db = { path = "crates/shared/tenant-db", version = "0.0.1" }
uptrakit-db-tx = { path = "crates/shared/db-tx", version = "0.0.1" }
uptrakit-web-api = { path = "crates/ui/web-api", version = "0.0.3", default-features = false }
uptrakit-web-api-auth = { path = "crates/ui/web-api-auth", version = "0.0.3", default-features = false }
uptrakit-web-api-queries = { path = "crates/ui/web-api-queries", version = "0.0.3", default-features = false }
uptrakit-audit-log = { path = "crates/shared/audit-log", version = "0.0.1", default-features = false }
uptrakit-build-info = { path = "crates/shared/build-info", version = "0.0.1" }
uptrakit-cli = { path = "crates/ui/cli", version = "0.0.6" }
uptrakit-mcp = { path = "crates/ui/mcp", version = "0.0.3" }
uptrakit-plugin-releases-docker = { path = "crates/plugins/releases/docker", version = "0.0.3", default-features = false }
uptrakit-plugin-releases-github = { path = "crates/plugins/releases/github", version = "0.0.3" }
uptrakit-plugin-releases-gitlab = { path = "crates/plugins/releases/gitlab", version = "0.0.3" }
uptrakit-plugin-releases-forgejo = { path = "crates/plugins/releases/forgejo", version = "0.0.3" }
uptrakit-plugin-generic-shell = { path = "crates/plugins/generic/shell", version = "0.0.3" }
uptrakit-plugin-package-manager-homebrew = { path = "crates/plugins/package-managers/homebrew", version = "0.0.3" }
uptrakit-plugin-package-manager-apt = { path = "crates/plugins/package-managers/apt", version = "0.0.3" }
uptrakit-plugin-package-manager-npm = { path = "crates/plugins/package-managers/npm", version = "0.0.3" }
uptrakit-plugin-package-manager-skills = { path = "crates/plugins/package-managers/skills", version = "0.0.3" }
uptrakit-plugin-package-manager-mas = { path = "crates/plugins/package-managers/mas", version = "0.0.3" }
uptrakit-plugin-package-manager-dnf = { path = "crates/plugins/package-managers/dnf", version = "0.0.3" }
uptrakit-plugin-package-manager-pacman = { path = "crates/plugins/package-managers/pacman", version = "0.0.3" }
uptrakit-plugin-package-manager-apk = { path = "crates/plugins/package-managers/apk", version = "0.0.3" }
uptrakit-plugin-package-manager-snap = { path = "crates/plugins/package-managers/snap", version = "0.0.3" }
uptrakit-plugin-package-manager-cargo = { path = "crates/plugins/package-managers/cargo", version = "0.0.3" }
uptrakit-package-manager-routeros = { path = "crates/plugins/package-managers/routeros", version = "0.0.3" }
uptrakit-plugin-infrastructure-proxmox = { path = "crates/plugins/infrastructure/proxmox", version = "0.0.3" }
uptrakit-plugin-hook-systemd = { path = "crates/plugins/hooks/systemd", version = "0.0.3" }
uptrakit-plugin-hook-shell = { path = "crates/plugins/hooks/shell", version = "0.0.3" }
uptrakit-plugin-enhancement-dashboard-icons = { path = "crates/plugins/enhancements/dashboard-icons", version = "0.0.3" }
uptrakit-plugin-discovery-proxmox-helper-scripts = { path = "crates/plugins/discovery/proxmox-helper-scripts", version = "0.0.3" }
uptrakit-plugin-discovery-uptrakit-self-update = { path = "crates/plugins/discovery/uptrakit-self-update", version = "0.0.3" }
# External deps used by a single crate — declared here so all versions are pinned in one place
russh = { version = "0.62" }
russh-sftp = { version = "2" }
ssh-key = { version = "0.6", default-features = false }
# tower-http stays at 0.6 (latest: 0.7.0) — reqwest 0.13.4 (latest) requires tower-http ^0.6.8;
# bumping would fork the graph into two tower-http versions for no gain
tower-http = { version = "0.6", default-features = false }
nix = { version = "0.31", default-features = false }
notify-debouncer-full = "0.7"
# Plan 3 (reexec) consumers; declared here for license review
listenfd = "1"
sd-notify = "0.5"
rust-embed = { version = "8", default-features = false }
mail-builder = { version = "0.4", default-features = false }
mail-send = { version = "0.6", default-features = false }
hmac = "0.13"
argon2 = { version = "0.5", default-features = false }
jsonwebtoken = { version = "11", default-features = false }
openidconnect = { version = "4", default-features = false }
client-ip = { version = "0.2", default-features = false }
percent-encoding = "2"
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9.0", default-features = false }
http-body-util = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
directories = "6"
# testcontainers stays at 0.27 (latest: 0.28.0) — testcontainers-modules 0.15.0 (latest) requires
# testcontainers ^0.27.0. This pin is what keeps bollard at 0.20; see the bollard comment above.
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"] }
tracing-test = { version = "0.2", default-features = false }
trybuild = "1"
testcontainers-modules = { version = "0.15", default-features = false, features = ["aws-lc-rs", "postgres"] }
paste = "1"
httpmock = "0.8"
tame-index = "0.26"
serde_urlencoded = "0.7"
husky-rs = { version = "0.4", default-features = false }
socket2 = "0.6"
mdns-sd = { version = "0.21", default-features = false }
walkdir = "2"

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Panic prevention
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"

# Silent failure prevention
map_err_ignore = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"

# Async correctness
large_futures = "deny"

# Memory and unsafe hygiene
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Numeric correctness
float_cmp = "deny"

# Suppression hygiene
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Hygiene
dbg_macro = "deny"
rc_mutex = "deny"

# Underscore-prefix hygiene
used_underscore_binding = "deny"
used_underscore_items = "deny"

[profile.dev]
# Reduce debug info to line tables only — backtraces still work,
# but variables are not inspectable in a debugger.
# Saves significant compile and link time.
debug = "line-tables-only"

[profile.dev.package."*"]
# Compile all third-party dependencies at opt-level 1 in dev mode.
# Minimal compile-time cost, but makes runtime (tests, local runs)
# noticeably faster. Only applied to dependencies, not workspace crates.
opt-level = 1

[profile.dev.package."aws-lc-sys"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = false
