[workspace]
resolver = "3"
members = [
    "crates/core/*",
    "crates/shared/*",
    "crates/ui/*",
    "crates/plugins/*/*",
]

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Andrey Yantsen"]
repository = "https://github.com/worried-networking/uptrakit"
version = "0.0.1"

[workspace.dependencies]
# Version pinned here; features declared per-crate.
tokio = { version = "1" }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive", "env"] }
rootcause = "0.12"
thiserror = "2"
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["pem", "x509-parser", "aws_lc_rs"] }
x509-parser = { version = "0.18", default-features = false, features = ["verify-aws", "verify"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-well-known"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sea-orm = { version = "2.0.0-rc.35", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-time", "with-uuid", "with-json"] }
sea-orm-migration = { version = "2.0.0-rc.35", default-features = false, features = ["runtime-tokio-rustls"] }
url = "2"
uuid = { version = "1.20" }
rand = "0.9"
hostname = "0.4"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
utoipa = { version = "5.4", features = ["uuid"] }
x509-ocsp = "0.2"
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
spki = { version = "0.7", features = ["alloc"] }
x509-cert = { version = "0.2", default-features = false }
const-oid = { version = "0.9", features = ["db"] }
aws-lc-rs = "1"
strum = { version = "0.27", features = ["derive"] }
regex = "1"
semver = "1"
tokio-stream = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
async-trait = "0.1"
bollard = { version = "0.20", default-features = false, features = ["http", "pipe"] }
tempfile = "3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
zeroize = { version = "1", features = ["derive"] }
async-nats = "0.46"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
cron = "0.15"
rumqttc = { version = "0.25.1" }
serde_yaml_ng = "0.10"
uptrakit-backoff = { path = "crates/shared/backoff" }
uptrakit-shared-macros = { path = "crates/shared/macros" }
uptrakit-shared-types = { path = "crates/shared/types" }
uptrakit-openapi-client = { path = "crates/shared/openapi-client" }
uptrakit-command = { path = "crates/shared/command" }
uptrakit-plugin-infrastructure-core = { path = "crates/plugins/infrastructure/core" }
uptrakit-plugin-infrastructure-registry = { path = "crates/plugins/infrastructure/registry", default-features = false }
# Internal crates (all must be referenced via workspace = true in member Cargo.toml files)
uptrakit-agent-core = { path = "crates/shared/agent-core" }
uptrakit-crypto = { path = "crates/shared/crypto" }
uptrakit-shared-db = { path = "crates/shared/db", default-features = false }
uptrakit-directories = { path = "crates/shared/directories" }
uptrakit-web-api-types = { path = "crates/shared/web-api-types" }
uptrakit-nats = { path = "crates/shared/nats" }
uptrakit-scheduler-engine = { path = "crates/shared/scheduler-engine" }
uptrakit-service-sdk = { path = "crates/shared/service-sdk" }
uptrakit-notification-channels = { path = "crates/shared/notification-channels", default-features = false }
uptrakit-update-hooks = { path = "crates/shared/update-hooks" }
uptrakit-internal-wire = { path = "crates/shared/wire" }
uptrakit-web-api = { path = "crates/ui/web-api", default-features = false }
uptrakit-audit-log = { path = "crates/shared/audit-log", default-features = false }
uptrakit-build-info = { path = "crates/shared/build-info" }
uptrakit-cli = { path = "crates/ui/cli" }
uptrakit-plugin-releases-docker = { path = "crates/plugins/releases/docker", default-features = false }
uptrakit-plugin-releases-github = { path = "crates/plugins/releases/github" }
uptrakit-plugin-releases-gitlab = { path = "crates/plugins/releases/gitlab" }
uptrakit-plugin-releases-forgejo = { path = "crates/plugins/releases/forgejo" }
uptrakit-plugin-generic-shell = { path = "crates/plugins/generic/shell" }
uptrakit-plugin-package-manager-homebrew = { path = "crates/plugins/package-managers/homebrew" }
uptrakit-plugin-package-manager-apt = { path = "crates/plugins/package-managers/apt" }
uptrakit-plugin-package-manager-npm = { path = "crates/plugins/package-managers/npm" }
uptrakit-plugin-discovery-proxmox-helper-scripts = { path = "crates/plugins/discovery/proxmox-helper-scripts" }
# External deps used by a single crate — declared here so all versions are pinned in one place
dirs = "6"
rpassword = "7"
russh = { version = "0.57", default-features = false }
ssh-key = { version = "0.6", default-features = false }
ssh2-config = "0.7"
tower-http = { version = "0.6", default-features = false }
nix = { version = "0.31", default-features = false }
rust-embed = { version = "8", default-features = false }
lettre = { version = "0.11", default-features = false }
hmac = "0.12"
argon2 = { version = "0.5", default-features = false }
jsonwebtoken = { version = "10", default-features = false }
openidconnect = "4"
client-ip = { version = "0.2", default-features = false }
percent-encoding = "2"
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9.0", default-features = false }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false }
directories = "6"
testcontainers = "0.27"
sha1 = "0.10"
httpmock = "0.8"
serde_urlencoded = "0.7"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.dev.package."aws-lc-sys"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
