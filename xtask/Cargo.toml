[package]
name = "xtask"
description = "Uptrakit xtask: workspace automation scripts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
walkdir = "2"
syn = { version = "2", features = ["full", "visit-mut"] }
proc-macro2 = "1"
quote = "1"
prettyplease = "0.2"
clap = { version = "4", features = ["derive"] }
