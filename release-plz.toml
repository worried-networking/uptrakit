[workspace]
publish = false
git_release_enable = false
git_tag_enable = false

[[package]]
name = "uptrakit-controller"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-controller-v{{ version }}"
git_release_name = "uptrakit-controller v{{ version }}"
include_paths = ["frontend/**", "crates/core/mqtt-runtime/**", "crates/core/scheduler-runtime/**", "crates/core/agent-runtime/**", "crates/core/agent-ssh-runtime/**"]

[[package]]
name = "uptrakit-agent"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-agent-v{{ version }}"
git_release_name = "uptrakit-agent v{{ version }}"
include_paths = ["crates/core/agent-runtime/**"]

[[package]]
name = "uptrakit-agent-ssh"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-agent-ssh-v{{ version }}"
git_release_name = "uptrakit-agent-ssh v{{ version }}"
include_paths = ["crates/core/agent-ssh-runtime/**"]

[[package]]
name = "uptrakit-mqtt"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-mqtt-v{{ version }}"
git_release_name = "uptrakit-mqtt v{{ version }}"
include_paths = ["crates/core/mqtt-runtime/**"]

[[package]]
name = "uptrakit-scheduler"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-scheduler-v{{ version }}"
git_release_name = "uptrakit-scheduler v{{ version }}"
include_paths = ["crates/core/scheduler-runtime/**"]

[[package]]
name = "uptrakit-cli"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-cli-v{{ version }}"
git_release_name = "uptrakit v{{ version }} (CLI)"

[[package]]
name = "uptrakit-openapi-client"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-openapi-client-v{{ version }}"
git_release_name = "uptrakit-openapi-client v{{ version }}"

[[package]]
name = "uptrakit-service-sdk"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-service-sdk-v{{ version }}"
git_release_name = "uptrakit-service-sdk v{{ version }}"
