# ===== Runtime crates: tagged so binary dep-bumps propagate; no own
# changelog (rolled into the binaries that depend on them) =====
[[package]]
name = "uptrakit-frontend"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-frontend-v{{ version }}"
publish = false

[[package]]
name = "uptrakit-agent-runtime"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-agent-runtime-v{{ version }}"
publish = false

[[package]]
name = "uptrakit-agent-ssh-runtime"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-agent-ssh-runtime-v{{ version }}"
publish = false

[[package]]
name = "uptrakit-mqtt-runtime"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-mqtt-runtime-v{{ version }}"
publish = false

[[package]]
name = "uptrakit-scheduler-runtime"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-scheduler-runtime-v{{ version }}"
publish = false

# controller-runtime is a library (lib backing both controller and
# controller-standalone). Its commits flow into both binaries' changelogs
# via changelog_include, so it does not write its own.
[[package]]
name = "uptrakit-controller-runtime"
git_only = true

# ===== Binary crates =====
# Lean controller: web-api + frontend + plugins + public libs.
# Excludes embedded service runtimes (agent-runtime, agent-ssh-runtime,
# mqtt-runtime, scheduler-runtime) — those ship only via standalone.
[[package]]
name = "uptrakit-controller"
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-controller-v{{ version }}"
git_release_name = "uptrakit-controller v{{ version }}"
changelog_update = true
changelog_include = [
