git_release_enable = false
git_tag_name = "uptrakit-scheduler-runtime-v{{ version }}"
publish = false

# controller-runtime owns the changelog file referenced by the
# controller and controller-standalone binaries. changelog_include here
# drives the rollup: its dep tree spans the entire controller surface
# (web-api, frontend, embedded runtimes, all plugins, shared libs).
[[package]]
name = "uptrakit-controller-runtime"
git_only = true
changelog_update = true
changelog_include = [
  "uptrakit-frontend",
  "uptrakit-agent-runtime",
  "uptrakit-agent-ssh",
  "uptrakit-agent-ssh-runtime",
