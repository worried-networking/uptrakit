# ===== Standalone consumable libraries: keep own tag/release/changelog =====
# These two crates are the public-facing API surface for external code.
# Public-API library commits (wire, shared-types, web-api-types, surfaces)
# roll up into them so downstream consumers see protocol/type changes
# without having to track multiple crates.
[[package]]
name = "uptrakit-openapi-client"
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-openapi-client-v{{ version }}"
git_release_name = "uptrakit-openapi-client v{{ version }}"
changelog_update = true
changelog_include = [
  "uptrakit-web-api-types",
  "uptrakit-shared-types",
  "uptrakit-surfaces",
]

[[package]]
