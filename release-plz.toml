[workspace]
publish = false
git_release_enable = false
git_tag_enable = false
# All crates have publish = false (path deps only). cargo-semver-checks
# would spawn cargo doc/build on baseline+current per library crate,
# duplicating the disk pressure the CI cargo wrapper aims to eliminate.
# With nothing publishable to crates.io, semver discipline is enforced
# by code review and the binary CI pipeline, not release-plz.
semver_check = false
# Default for non-binary crates: do not write per-crate CHANGELOG.md.
# Library/plugin/runtime commits flow into binary changelogs via the
# changelog_include arrays below. Binary [[package]] entries override
# this with changelog_update = true.
changelog_update = false

# ===== Excluded =====
# Integration tests are runtime-only verification; their commits should
# not appear in user-facing binary changelogs.
[[package]]
name = "uptrakit-integration-tests"
release = false

