# ===== Standalone consumable libraries: keep own tag/release/changelog =====
# These two crates are the public-facing API surface for external code and
# are the only members shipped to crates.io. Public-API library commits
# (wire, shared-types, web-api-types, surfaces) roll up into them so
# downstream consumers see protocol/type changes without having to track
# multiple crates.
#
# `publish = true` overrides the workspace `publish = false` so release-plz
# actually runs `cargo publish` for these two. Without it, release-plz
# treats their git tag as the "already published" marker, skips the
# crates.io upload, and then — on the next cycle — sees local Cargo.toml
# ahead of the (stale) crates.io version and refuses to bump further
# ("local version > registry version. Only changelog will be updated"),
# wedging both crates forever. Keep this here.
[[package]]
name = "uptrakit-openapi-client"
publish = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-openapi-client-v{{ version }}"
git_release_name = "uptrakit-openapi-client v{{ version }}"
changelog_update = true
changelog_include = [
  "uptrakit-web-api-types",
  "uptrakit-shared-types",
  "uptrakit-surfaces",
]

[[package]]
name = "uptrakit-service-sdk"
publish = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-service-sdk-v{{ version }}"
git_release_name = "uptrakit-service-sdk v{{ version }}"
changelog_update = true
changelog_include = [
  "uptrakit-wire",
  "uptrakit-shared-types",
  "uptrakit-surfaces",
]
