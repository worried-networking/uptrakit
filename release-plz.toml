[workspace]
publish = false
git_release_enable = false
git_tag_enable = false
# All crates have publish = false (path deps only). cargo-semver-checks
# would spawn cargo doc/build on baseline+current per library crate,
# duplicating the disk pressure the CI cargo wrapper aims to eliminate.
# With nothing publishable to crates.io, semver discipline is enforced
# by code review and the binary CI pipeline, not release-plz.
semver_check = false

[[package]]
name = "uptrakit-shared-macros"

[[package]]
name = "uptrakit-surfaces"

[[package]]
name = "uptrakit-shared-types"

[[package]]
name = "uptrakit-wire"

[[package]]
name = "uptrakit-web-api-types"

[[package]]
name = "uptrakit-frontend"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-frontend-v{{ version }}"
publish = false
changelog_update = false

# Runtime crates: versioned + tagged so binary packages pick up dep-propagated bumps.
# No publish (path deps only); no GitHub release (internals, not end-user artifacts).
[[package]]
name = "uptrakit-agent-runtime"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-agent-runtime-v{{ version }}"
publish = false

[[package]]
name = "uptrakit-agent-ssh-runtime"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-agent-ssh-runtime-v{{ version }}"
publish = false

[[package]]
name = "uptrakit-mqtt-runtime"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-mqtt-runtime-v{{ version }}"
publish = false

[[package]]
name = "uptrakit-scheduler-runtime"
git_only = true
git_tag_enable = true
git_release_enable = false
git_tag_name = "uptrakit-scheduler-runtime-v{{ version }}"
publish = false

[[package]]
name = "uptrakit-controller-runtime"
git_only = true
changelog_update = true
changelog_include = [
  "uptrakit-frontend",
  "uptrakit-agent-runtime",
  "uptrakit-agent-ssh-runtime",
  "uptrakit-mqtt-runtime",
  "uptrakit-scheduler-runtime",
]

[[package]]
name = "uptrakit-controller"
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-controller-v{{ version }}"
git_release_name = "uptrakit-controller v{{ version }}"
changelog_path = "crates/core/controller-runtime/CHANGELOG.md"
changelog_update = false

[[package]]
name = "uptrakit-controller-standalone"
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-controller-standalone-v{{ version }}"
git_release_name = "uptrakit-controller-standalone v{{ version }}"
changelog_path = "crates/core/controller-runtime/CHANGELOG.md"
changelog_update = false

[[package]]
name = "uptrakit-agent"
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-agent-v{{ version }}"
git_release_name = "uptrakit-agent v{{ version }}"
changelog_include = ["uptrakit-agent-runtime"]

[[package]]
name = "uptrakit-agent-ssh"
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-agent-ssh-v{{ version }}"
git_release_name = "uptrakit-agent-ssh v{{ version }}"
changelog_include = ["uptrakit-agent-ssh-runtime"]

[[package]]
name = "uptrakit-mqtt"
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-mqtt-v{{ version }}"
git_release_name = "uptrakit-mqtt v{{ version }}"
changelog_include = ["uptrakit-mqtt-runtime"]

[[package]]
name = "uptrakit-scheduler"
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-scheduler-v{{ version }}"
git_release_name = "uptrakit-scheduler v{{ version }}"
changelog_include = ["uptrakit-scheduler-runtime"]

[[package]]
name = "uptrakit-cli"
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "uptrakit-cli-v{{ version }}"
git_release_name = "uptrakit v{{ version }} (CLI)"

[[package]]
name = "uptrakit-openapi-client"
git_release_enable = true
git_tag_enable = true
