[workspace]
publish = false
git_release_enable = false
# Workspace-default ON so every analyzed [[package]] gets a baseline
# git tag. release-plz uses each git_only package's last matching tag as
# the `published_at_sha1` anchor when walking commits for changelog
# generation. Without per-package tags, included library/runtime/plugin
# crates have no anchor (their `publish = false` means no crates.io
# tarball equality check either) and release-plz walks unbounded
# history, re-dumping into binary CHANGELOGs every cycle (see PRs
# #131/#132). `release = false` packages stay un-tagged since
# release-plz excludes them from analysis entirely. Binary packages
# already set their own `git_tag_name`, so behavior is preserved.
git_tag_enable = true
# All crates have publish = false (path deps only). cargo-semver-checks
# would spawn cargo doc/build on baseline+current per library crate,
# duplicating the disk pressure the CI cargo wrapper aims to eliminate.
# With nothing publishable to crates.io, semver discipline is enforced
# by code review and the binary CI pipeline, not release-plz.
semver_check = false
# Default for non-binary crates: do not write per-crate CHANGELOG.md.
# Library/plugin/runtime commits flow into binary changelogs via the
# changelog_include arrays below. Binary [[package]] entries override
# this with changelog_update = true.
changelog_update = false

# GitHub's Release body API caps the `body` field at 125 000 characters.
# The controller and controller-standalone changelogs each grew past
# 160 KB during the run-up to v0.0.4, which caused `release-plz release`
# to hit HTTP 422 mid-loop and leave the surrounding binaries assetless.
# Truncating at the body-template level keeps the initial release page
# creation under the limit. For larger changelogs the release body is
# the first 100 KB plus a pointer to the in-repo `CHANGELOG.md` — the
# repo no longer post-processes release notes through an external
# summariser, so operators are expected to edit the body manually
# after the release if a fuller narrative is wanted.
git_release_body = """{% if changelog | length > 100000 -%}
{{ changelog | truncate(length=100000, end="") }}

> _Changelog truncated to 100 KB to keep this release page under
> GitHub's 125 KB body limit. The full version history is in this
> package's `CHANGELOG.md` in the repo._
{%- else -%}
{{ changelog }}
{%- endif %}"""

# ===== Excluded from analysis (release = false) =====
# Integration tests are runtime-only verification.
[[package]]
name = "uptrakit-integration-tests"
release = false

# Functional tests are runtime-only verification.
[[package]]
name = "uptrakit-functional-tests"
release = false

# Internal infrastructure utility crates: their commits are mechanical
# (retry math, exec wrappers, encryption helpers, build-time metadata,
# tracing init, etc.) and don't merit user-visible changelog entries.
# Skipping analysis avoids per-crate version bumps on every commit.
#
# uptrakit-shared-macros and uptrakit-build-info were moved out of this
# group into the "Public-API library crates (ship to crates.io)" section
# below — they're transitive deps of uptrakit-service-sdk /
# uptrakit-openapi-client and so must be release-plz–managed + published.
#
# Proc-macro for audit-log. Declared as a direct path dep (not workspace) in
# audit-log/Cargo.toml. With release = false, release-plz leaves the dep
# declaration untouched; audit-log/Cargo.toml carries version = "0.0.1"
# explicitly so cargo package manifest validation passes.
[[package]]
name = "uptrakit-audit-log-derive"
release = false

[[package]]
name = "uptrakit-backoff"
release = false

[[package]]
name = "uptrakit-command"
release = false

[[package]]
name = "uptrakit-crypto"
release = false

[[package]]
name = "uptrakit-shared-db"
release = false

[[package]]
name = "uptrakit-directories"
release = false

[[package]]
name = "uptrakit-github-client"
release = false

[[package]]
name = "uptrakit-global-github-provider"
release = false

[[package]]
name = "uptrakit-audit-log"
release = false

[[package]]
name = "uptrakit-config-merge"
release = false

# controller-core is listed in both controller binaries' changelog_include
# arrays. release-plz cannot auto-tag a `release = false` crate, which
# would re-bloat the binary CHANGELOGs every cycle. Use the same
# git_only shape as controller-runtime so release-plz silently version-
# bumps and tags it without creating a GitHub release page or publishing
# to crates.io.
[[package]]
name = "uptrakit-controller-core"
git_only = true
git_release_enable = false
publish = false

[[package]]
name = "uptrakit-nats"
release = false

[[package]]
name = "uptrakit-service-platform"
release = false

# service-connections is in both controller binaries' changelog_include
# arrays — same rationale as controller-core above.
[[package]]
name = "uptrakit-service-connections"
git_only = true
git_release_enable = false
publish = false

[[package]]
name = "uptrakit-tenant-db"
release = false

[[package]]
name = "uptrakit-tracing-init"
release = false

# ===== Public-API library crates (ship to crates.io) =====
# Transitive deps of uptrakit-service-sdk and uptrakit-openapi-client
# (post wire dev-dep cut; see
# docs/superpowers/specs/2026-06-09-publishable-crate-squat-chain-break-design.md).
# `publish = true` overrides workspace `publish = false` so release-plz runs
# `cargo publish` per cycle; the crates.io tarball-equality check then acts as
# the `published_at_sha1` anchor for the commit walk that builds binary
# CHANGELOGs (PRs #131/#132 root-caused the unbounded walk to a missing anchor
# — git-tag and crates.io-tarball both qualify; this one was just unavailable
# before we started publishing).
# Each lib stays `git_release_enable = false`: no separate GitHub release page,
# only the auto-tag from the workspace default. No own CHANGELOG.md either —
# commits flow into binary changelogs via changelog_include.
# Adding a new uptrakit-* dep to service-sdk or openapi-client requires
# adding it to this section. Phase 4 Rust test enforces this. Adding a banned
# dep (audit-log et al.) is prevented by the squat-chain spec's tests in
# crates/shared/{service-sdk,openapi-client}/tests/no_workspace_db_deps.rs.
[[package]]
name = "uptrakit-shared-types"
git_release_enable = false
publish = true

[[package]]
name = "uptrakit-surfaces"
git_release_enable = false
publish = true

[[package]]
name = "uptrakit-wire"
git_release_enable = false
publish = true

[[package]]
name = "uptrakit-web-api-types"
git_release_enable = false
publish = true

[[package]]
name = "uptrakit-shared-macros"
git_release_enable = false
publish = true

[[package]]
name = "uptrakit-build-info"
git_release_enable = false
publish = true

[[package]]
name = "uptrakit-agent-core"
git_only = true
git_release_enable = false
publish = false

[[package]]
name = "uptrakit-web-api"
git_only = true
git_release_enable = false
publish = false

[[package]]
name = "uptrakit-web-api-auth"
