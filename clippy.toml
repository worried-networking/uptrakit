allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true

# TLS 1.3 PSK resumption skips Certificate/CertificateVerify on resumed
# sessions, so a resumption cache shared across cert rotations keeps
# presenting the old (potentially revoked) client cert to the server.
# Force every resolver-based mTLS `ClientConfig` to go through
# `CertScopedClientSessionStore` (see
# `crates/shared/service-sdk/src/session_store.rs`) so cert rotation
# flushes the cache atomically.
disallowed-methods = [
    { path = "rustls::client::Resumption::in_memory_sessions", reason = "use uptrakit_service_sdk::session_store::CertScopedClientSessionStore — TLS 1.3 resumption with a swappable client cert must invalidate on rotation" },
    # SQLite BEGIN DEFERRED on a read-then-write transaction fails with
    # SQLITE_BUSY_SNAPSHOT (bypasses busy_timeout) whenever another connection
    # commits between the read and the write. begin_immediate() opens
    # BEGIN IMMEDIATE (a mode no-op on Postgres and on savepoints) and is the
    # workspace's sole sanctioned transaction opener. Escape hatch:
    # #[expect(clippy::disallowed_methods, reason = "...")] naming either a
    # write-only rationale or the non-default TransactionOptions field needed.
    { path = "sea_orm::TransactionTrait::begin", reason = "use begin_immediate() (uptrakit-db-tx; re-exported by uptrakit-shared-db) — BEGIN DEFERRED causes SQLITE_BUSY_SNAPSHOT on read-then-write" },
    { path = "sea_orm::TransactionTrait::begin_with_config", reason = "use begin_immediate() — begin_with_config(None, None) opens BEGIN DEFERRED" },
    { path = "sea_orm::TransactionTrait::begin_with_options", reason = "use begin_immediate() — TransactionOptions::default() opens BEGIN DEFERRED" },
    { path = "sea_orm::TransactionTrait::transaction", reason = "use begin_immediate() — the closure API opens BEGIN DEFERRED" },
    { path = "sea_orm::TransactionTrait::transaction_with_config", reason = "use begin_immediate() — the closure API opens BEGIN DEFERRED" },
    { path = "sea_orm::DatabaseTransaction::transaction_async", reason = "use begin_immediate() — the closure API opens BEGIN DEFERRED" },
    { path = "sea_orm::DatabaseTransaction::transaction_with_config_async", reason = "use begin_immediate() — the closure API opens BEGIN DEFERRED" },
    { path = "sea_orm::DatabaseConnection::transaction_async", reason = "use begin_immediate() — the closure API opens BEGIN DEFERRED" },
    { path = "sea_orm::DatabaseConnection::transaction_with_config_async", reason = "use begin_immediate() — the closure API opens BEGIN DEFERRED" },
    { path = "sea_orm::DatabaseExecutor::transaction_async", reason = "use begin_immediate() — the closure API opens BEGIN DEFERRED" },
    { path = "sea_orm::DatabaseExecutor::transaction_with_config_async", reason = "use begin_immediate() — the closure API opens BEGIN DEFERRED" },

    # AGENTS.md rule 10: no raw SQL. Use sea_query builders (SeaORM's typed
    # query API) everywhere, including migrations. See
    # docs/development/database-migrations.md for the approved-exception
    # table and the SQLite table-recreation guide; escape hatch is
    # #[expect(clippy::disallowed_methods, reason = "...")].
    { path = "sea_orm::Statement::from_string", reason = "raw SQL banned (AGENTS.md rule 10) — use sea_query builders; see docs/development/coding-standards.md § Raw-SQL ban" },
    { path = "sea_orm::Statement::from_sql_and_values", reason = "raw SQL banned (AGENTS.md rule 10) — use sea_query builders; see docs/development/coding-standards.md § Raw-SQL ban" },
    { path = "sea_orm::ConnectionTrait::execute_unprepared", reason = "raw SQL banned (AGENTS.md rule 10) — use sea_query builders; liveness probes use a builder SELECT 1, see docs/development/coding-standards.md § Raw-SQL ban" },
    { path = "sea_query::Expr::cust", reason = "raw SQL fragment inside a builder — use typed expressions (Expr::current_timestamp, ExprTrait methods)" },
    { path = "sea_query::Expr::cust_with_values", reason = "raw SQL fragment inside a builder — use typed expressions" },
    { path = "sea_query::Expr::cust_with_expr", reason = "raw SQL fragment inside a builder — use typed expressions" },
    { path = "sea_query::Expr::cust_with_exprs", reason = "raw SQL fragment inside a builder — use typed expressions" },

    # Outbound HTTP clients: direct builders skip the SSRF resolver and the
    # typed RedirectMode (spec 2026-08-13-plugin-http-redirect-security).
    # Escape hatches: build_plugin_http_client's own builder call (the
    # enforcement point), the operator-context/internal-only clients in
    # openapi-client/service-sdk/cli (see docs/security/secure-development.md,
    # SSRF section), and test clients to local mock endpoints. Each carries a
    # scoped #[expect] naming its exception. reqwest::Client::default() routes
    # through the Default trait and cannot be listed here (clippy limitation,
    # see bead uptrakit-6bsg7); it has zero usages today and the test canaries
    # keep the listed entries resolving.
    { path = "reqwest::Client::builder", reason = "use build_plugin_http_client — direct builders skip the SSRF resolver and typed RedirectMode" },
    { path = "reqwest::Client::new", reason = "use build_plugin_http_client — direct builders skip the SSRF resolver and typed RedirectMode" },
    { path = "reqwest::ClientBuilder::new", reason = "use build_plugin_http_client — direct builders skip the SSRF resolver and typed RedirectMode" },
]

disallowed-macros = [
    { path = "sea_orm::raw_sql", reason = "raw SQL banned (AGENTS.md rule 10) — use sea_query builders" },
]
