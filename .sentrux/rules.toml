# Sentrux architectural rules for uptrakit
# Run:  sentrux check .
# MCP:  sentrux.check_rules()

# ── Constraints ───────────────────────────────────────────────────────────────

[constraints]

# max_grade = "C"  # uncomment to enforce an overall health floor

# Cross-crate cycles are already prevented by Cargo; this catches logical
# module-level cycles within a crate.
max_cycles = 0

# A complex plugin/auth system will never reach A, but C is manageable.
max_coupling = "C"

# Rust match arms each add 1 to CC, so route handlers and plugin dispatchers
# legitimately reach 20+. Raised to 35 to accommodate exhaustive flat match tables
# on large enums (e.g. Permission with 34 variants): each arm is O(1) and
# cognitively equivalent to a lookup table, so CC=34 is not a readability problem.
# The rule still catches genuinely nested conditional spaghetti (CC > 35).
max_cc = 35

# Route handlers and batch executors are inherently long.
max_fn_lines = 150

max_file_lines = 800

# Plugin registries and route aggregators have intentionally high fan-out.
no_god_files = false

# ── Layers ────────────────────────────────────────────────────────────────────
#
# Dependency direction: shared <- plugins <- plugin_protocol_clients <- ui <- binaries
#
# `plugin_protocol_clients` is the explicit operational carve-out for crates
# that coordinate plugin protocol/runtime operations directly.

[[layers]]
name = "binaries"
paths = [
  "crates/core/agent/**",
  "crates/core/agent-runtime/**",
  "crates/core/agent-ssh-runtime/**",
  "crates/core/controller/**",
  "crates/core/integration-tests/**",
  "crates/core/mqtt/**",
  "crates/core/mqtt-runtime/**",
  "crates/core/scheduler/**",
  "crates/core/scheduler-runtime/**",
]
order = 0

[[layers]]
name = "ui"
paths = ["crates/ui/**"]
order = 1

[[layers]]
name = "plugin_protocol_clients"
paths = [
  "crates/shared/agent-core/**",
  "crates/shared/scheduler-engine/**",
  "crates/core/agent-ssh/**",
]
order = 2

[[layers]]
name = "plugins"
paths = ["crates/plugins/**"]
order = 3

[[layers]]
name = "shared"
paths = [
  "crates/shared/audit-log/**",
  "crates/shared/backoff/**",
  "crates/shared/build-info/**",
  "crates/shared/command/**",
  "crates/shared/crypto/**",
  "crates/shared/db/**",
  "crates/shared/directories/**",
  "crates/shared/extension-framework/**",
  "crates/shared/macros/**",
  "crates/shared/nats/**",
  "crates/shared/openapi-client/**",
  "crates/shared/service-platform/**",
  "crates/shared/service-sdk/**",
  "crates/shared/tracing-init/**",
  "crates/shared/types/**",
  "crates/shared/update-hooks/**",
  "crates/shared/web-api-types/**",
  "crates/shared/wire/**",
]
order = 4

# ── Boundaries ────────────────────────────────────────────────────────────────

[[boundaries]]
from = "crates/plugins/**"
to = "crates/core/**"
reason = "Plugin library crates must not depend on binary entry-point crates"

[[boundaries]]
from = "crates/shared/**"
to = "crates/ui/**"
reason = "Shared library crates must not depend on the UI layer"

[[boundaries]]
from = "crates/shared/**"
to = "crates/core/**"
reason = "Shared library crates must not depend on binary entry-point crates"

[[boundaries]]
from = "crates/core/agent/**"
to = "crates/ui/web-api/**"
reason = "Agent must not depend on controller-side web-api"

[[boundaries]]
from = "crates/plugins/releases/**"
to = "crates/plugins/package-managers/**"
reason = "Release plugins must not depend on package manager plugins"

[[boundaries]]
from = "crates/plugins/package-managers/**"
to = "crates/plugins/releases/**"
reason = "Package manager plugins must not depend on release plugins"

[[boundaries]]
from = "crates/plugins/notifications/**"
to = "crates/plugins/releases/**"
reason = "Notification plugins must not depend on release plugins"

[[boundaries]]
from = "crates/plugins/notifications/**"
to = "crates/plugins/package-managers/**"
reason = "Notification plugins must not depend on package manager plugins"

[[boundaries]]
from = "crates/plugins/notifications/**"
to = "crates/plugins/discovery/**"
reason = "Notification plugins must not depend on discovery plugins"

[[boundaries]]
from = "crates/plugins/discovery/**"
to = "crates/plugins/notifications/**"
reason = "Discovery plugins must not depend on notification plugins"

