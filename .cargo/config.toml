[alias]
xtask = "run --package xtask --"

# Fake registry: satisfies cargo's publish-target validation for
# `publish = ["uptrakit-private"]` in [workspace.package]. Without this,
# `cargo package --workspace` fails to resolve the registry source id.
# We never actually publish here; the sparse+crates.io URL means any
# accidental `cargo publish` attempt would still require a valid token.
[registries.uptrakit-private]
index = "sparse+https://index.crates.io/"

# Work around recurring crates.io CDN flake: curl's HTTP/2 framing layer
# gets connection-reset mid-download ("[16] Error in the HTTP2 framing
# layer (Send failure: Connection reset)"), notably during release-plz
# `cargo package`. Disabling multiplexing forces HTTP/1.1 and avoids it;
# the retry bump rides out transient resets / 429s.
[http]
multiplexing = false

[net]
retry = 10

# Build speed optimizations for development.
# These settings do not affect release builds or CI unless explicitly opted in.

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "split-debuginfo=unpacked"]
