    { crate = "aead@0.5.2", reason = "pulled by aes-gcm 0.10 / chacha20poly1305 (openidconnect crypto); newer 0.6-rc used by russh 0.60" },
    { crate = "aes@0.8.4", reason = "pulled by aes-gcm 0.10 (openidconnect); newer 0.9 used by russh 0.60" },
