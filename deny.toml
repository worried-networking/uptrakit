    { crate = "windows-targets@0.52.6", reason = "pulled by windows-sys@0.52.0 (older toolchain deps); newer 0.53.5+ used by clap, tokio" },

    # windows arch crates 0.48.5 via windows-targets@0.48.5; 0.52.6 via windows-targets@0.52.6
