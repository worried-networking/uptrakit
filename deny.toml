    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "pulled by windows-targets@0.52.6 (older toolchain deps)" },
    { crate = "windows_aarch64_gnullvm@0.53.1", reason = "pulled by windows-targets@0.53.5 (socket-pktinfo → mdns-sd)" },
    { crate = "windows_aarch64_msvc@0.48.5", reason = "pulled by windows-targets@0.48.5 (etcetera → sqlx-postgres)" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "pulled by windows-targets@0.52.6 (older toolchain deps)" },
    { crate = "windows_aarch64_msvc@0.53.1", reason = "pulled by windows-targets@0.53.5 (socket-pktinfo → mdns-sd)" },
    { crate = "windows_i686_gnu@0.48.5", reason = "pulled by windows-targets@0.48.5 (etcetera → sqlx-postgres)" },
    { crate = "windows_i686_gnu@0.52.6", reason = "pulled by windows-targets@0.52.6 (older toolchain deps)" },
    { crate = "windows_i686_gnu@0.53.1", reason = "pulled by windows-targets@0.53.5 (socket-pktinfo → mdns-sd)" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "pulled by windows-targets@0.52.6 (older toolchain deps)" },
    { crate = "windows_i686_gnullvm@0.53.1", reason = "pulled by windows-targets@0.53.5 (socket-pktinfo → mdns-sd)" },
    { crate = "windows_i686_msvc@0.48.5", reason = "pulled by windows-targets@0.48.5 (etcetera → sqlx-postgres)" },
    { crate = "windows_i686_msvc@0.52.6", reason = "pulled by windows-targets@0.52.6 (older toolchain deps)" },
    { crate = "windows_i686_msvc@0.53.1", reason = "pulled by windows-targets@0.53.5 (socket-pktinfo → mdns-sd)" },
