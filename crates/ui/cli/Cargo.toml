[package]
name = "uptrakit-cli"
description = "Command-line interface for the Uptrakit platform"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.2"

[lib]
name = "uptrakit_cli"
path = "src/lib.rs"

[[bin]]
name = "uptrakit"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tracing = { workspace = true }
uptrakit-tracing-init = { workspace = true, features = ["cli"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rootcause = { workspace = true }
uptrakit-shared-macros = { workspace = true }
thiserror = { workspace = true }
hostname = { workspace = true }
time = { workspace = true }
uptrakit-openapi-client = { workspace = true, features = ["tracing"] }
uuid = { workspace = true }
serde_yaml_ng = { workspace = true }
uptrakit-build-info = { workspace = true }
uptrakit-directories = { workspace = true }
uptrakit-wire = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-crypto = { workspace = true }

[dev-dependencies]
uptrakit-openapi-client = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
base64 = { workspace = true }
rcgen = { workspace = true }

[build-dependencies]
uptrakit-build-info = { workspace = true }

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/uptrakit-cli-v{ version }/uptrakit-cli-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"

[[package.metadata.binstall.overrides]]
bin-name = "uptrakit"
bin-dir = "uptrakit{ binary-ext }"
