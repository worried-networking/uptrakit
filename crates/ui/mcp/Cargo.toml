[package]
name = "uptrakit-mcp"
description = "MCP server for uptrakit — transport, auth layer, and tools"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"
publish.workspace = true

[dependencies]
uptrakit-web-api-types    = { workspace = true }
uptrakit-shared-db        = { workspace = true }
uptrakit-controller-core  = { workspace = true }
uptrakit-web-api-queries  = { workspace = true }
uptrakit-audit-log        = { workspace = true }
tokio-util                = { workspace = true }
tracing                   = { workspace = true }
rmcp                      = { workspace = true }
vt100                  = { workspace = true }
schemars               = { workspace = true }
sea-orm                = { workspace = true }
axum                   = { workspace = true }
tower                  = { workspace = true }
uuid                   = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
thiserror              = { workspace = true }

[features]
db-sqlite = ["uptrakit-shared-db/db-sqlite", "sea-orm/sqlx-sqlite"]

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
uptrakit-shared-db     = { workspace = true, features = ["migration", "db-sqlite"] }
uptrakit-web-api-auth  = { workspace = true }
uptrakit-shared-types  = { workspace = true }
uptrakit-crypto        = { workspace = true, features = ["testing"] }
reqwest                = { workspace = true }
time                   = { workspace = true }
tokio                  = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
