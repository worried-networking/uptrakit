[package]
name = "uptrakit-web-api-queries"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[features]
default = []
db-all = ["db-sqlite", "db-postgres"]
db-sqlite = ["sea-orm/sqlx-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres"]
oidc = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
rootcause = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
uptrakit-audit-log = { workspace = true, features = ["db"] }
uptrakit-command = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
uptrakit-wire = { workspace = true }
uptrakit-plugin-infrastructure-registry = { workspace = true }
uptrakit-shared-db = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-config-merge = { workspace = true }
uptrakit-scheduler-engine = { workspace = true }
uptrakit-web-api-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
uptrakit-crypto = { workspace = true, features = ["testing"] }
uptrakit-shared-db = { workspace = true, features = ["migration", "db-sqlite"] }

[lints]
workspace = true
