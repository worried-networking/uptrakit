[package]
name = "uptrakit-web-api-queries"
description = "Uptrakit web-api queries: tenant-scoped DB query layer"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.3"

[features]
default = []
db-all = ["db-sqlite", "db-postgres"]
db-sqlite = ["sea-orm/sqlx-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres"]
oidc = []
plugin-ops = ["uptrakit-plugin-infrastructure-registry/plugin-ops"]

[dependencies]
async-trait = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rootcause = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
uptrakit-audit-log = { workspace = true, features = ["db"] }
uptrakit-command = { workspace = true }
uptrakit-config-reload = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
uptrakit-wire = { workspace = true }
uptrakit-plugin-infrastructure-registry = { workspace = true, features = ["migrations"] }
uptrakit-shared-db = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-config-merge = { workspace = true }
uptrakit-web-api-types = { workspace = true }

[dev-dependencies]
strum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
uptrakit-crypto = { workspace = true, features = ["testing"] }
uptrakit-shared-db = { workspace = true, features = ["migration", "db-sqlite"] }
uptrakit-plugin-infrastructure-proxmox = { workspace = true, features = ["migrations", "plugin-ops"] }

[lints]
workspace = true
