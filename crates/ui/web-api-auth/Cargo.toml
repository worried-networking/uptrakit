[package]
name = "uptrakit-web-api-auth"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[features]
default = []
oidc = ["dep:openidconnect"]

[dependencies]
argon2 = { workspace = true, features = ["std"] }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
parking_lot = { workspace = true }
rand = { workspace = true }
rootcause = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
openidconnect = { workspace = true, optional = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
uptrakit-shared-db = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-web-api-types = { workspace = true }

[dev-dependencies]
strum = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
zeroize = { workspace = true }

[lints]
workspace = true
