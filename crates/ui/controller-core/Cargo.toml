[package]
name = "uptrakit-controller-core"
description = "Controller core state types — no HTTP routing or MCP layer dependency"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.2"
publish.workspace = true

[dependencies]
uptrakit-web-api-auth                   = { workspace = true }
uptrakit-web-api-queries                = { workspace = true }
uptrakit-web-api-types                  = { workspace = true }
uptrakit-notification-delivery          = { workspace = true }
uptrakit-shared-types                   = { workspace = true }
uptrakit-shared-db                      = { workspace = true }
uptrakit-audit-log                      = { workspace = true }
uptrakit-crypto                         = { workspace = true }
uptrakit-plugin-infrastructure-registry = { workspace = true }
uptrakit-wire                           = { workspace = true }
uptrakit-service-connections            = { workspace = true }
uptrakit-shared-macros                  = { workspace = true }
async-trait  = { workspace = true }
axum         = { workspace = true, optional = true }
ipnet        = { workspace = true }
metrics      = { workspace = true }
moka         = { workspace = true, features = ["sync"] }
sea-orm      = { workspace = true }
serde_json   = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true }
tokio        = { workspace = true, features = ["time"] }
tokio-util   = { workspace = true }
parking_lot  = { workspace = true }
rootcause    = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }

[features]
axum-integration = ["dep:axum"]
nats = []
plugin-ops = [
    "uptrakit-web-api-queries/plugin-ops",
    "uptrakit-plugin-infrastructure-registry/plugin-ops",
]
# Expose test-only helpers (e.g. `NotificationDispatcher::test_channel`) to
# dependent crates' test targets without requiring #[cfg(test)].
testing = []

[dev-dependencies]
uptrakit-shared-db = { workspace = true, features = ["migration", "db-sqlite"] }
sea-orm            = { workspace = true, features = ["sqlx-sqlite", "mock"] }
strum              = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
