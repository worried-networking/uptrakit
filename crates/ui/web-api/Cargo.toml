[package]
name = "uptrakit-web-api"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[features]
default = ["oidc"]
oidc = ["dep:openidconnect"]
swagger-ui = ["dep:utoipa-swagger-ui"]
nats = ["dep:async-nats", "dep:uptrakit-nats"]
notifications-telegram = ["uptrakit-notification-channels/telegram"]
notifications-email = ["uptrakit-notification-channels/email"]
notifications-all = ["notifications-telegram", "notifications-email"]
db-all = ["db-sqlite", "db-postgres", "db-mysql"]
db-sqlite = ["sea-orm/sqlx-sqlite", "uptrakit-web-api-queries/db-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres", "uptrakit-web-api-queries/db-postgres"]
db-mysql = ["sea-orm/sqlx-mysql", "uptrakit-web-api-queries/db-mysql"]

[dependencies]
async-stream = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
ipnet = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
time = { workspace = true }
rootcause = { workspace = true }
uptrakit-shared-macros = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
uptrakit-directories = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
uptrakit-shared-db = { workspace = true }
uptrakit-update-hooks = { workspace = true }
uptrakit-shared-types = { workspace = true, features = ["openapi"] }
uptrakit-internal-wire = { workspace = true }
uptrakit-plugin-infrastructure-registry = { workspace = true }
uptrakit-command = { workspace = true }
argon2 = { workspace = true, features = ["std"] }
rand = { workspace = true }
client-ip = { workspace = true, features = ["forwarded-header"] }
x509-parser = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
uptrakit-web-api-types = { workspace = true, features = ["openapi"] }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = { workspace = true }
openidconnect = { workspace = true, optional = true }
url = { workspace = true }
percent-encoding = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
axum-server = { workspace = true }
hostname = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"], optional = true }
x509-ocsp = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
x509-cert = { workspace = true }
const-oid = { workspace = true }
aws-lc-rs = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { workspace = true }
zeroize = { workspace = true }
async-nats = { workspace = true, optional = true }
uptrakit-nats = { workspace = true, optional = true }
uptrakit-audit-log = { workspace = true, features = ["db"] }
uptrakit-notification-channels = { workspace = true, features = ["webhook"] }
uptrakit-web-api-queries = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "net"] }
tower = { workspace = true }
http-body-util = { workspace = true }
strum = { workspace = true }
uptrakit-shared-db = { workspace = true, features = ["migration", "db-sqlite"] }
tokio-tungstenite = { workspace = true }
jsonwebtoken = { workspace = true }

[lints]
workspace = true
