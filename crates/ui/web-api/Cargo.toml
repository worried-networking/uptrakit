[package]
name = "uptrakit-web-api"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[features]
default = ["oidc"]
oidc = ["dep:openidconnect"]
swagger-ui = ["dep:utoipa-swagger-ui"]
nats = ["dep:async-nats", "dep:uptrakit-nats"]
notifications-telegram = ["uptrakit-notification-channels/telegram"]
notifications-email = ["uptrakit-notification-channels/email"]
notifications-all = ["notifications-telegram", "notifications-email"]
db-all = ["db-sqlite", "db-postgres", "db-mysql"]
db-sqlite = ["sea-orm/sqlx-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres"]
db-mysql = ["sea-orm/sqlx-mysql"]

[dependencies]
async-stream = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
ipnet = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
time = { workspace = true }
rootcause = { workspace = true }
uptrakit-shared-macros = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
uptrakit-directories = { path = "../../shared/directories" }
uptrakit-crypto = { path = "../../shared/crypto", features = ["sea-orm"] }
uptrakit-shared-db = { path = "../../shared/db" }
uptrakit-update-hooks = { path = "../../shared/update-hooks" }
uptrakit-shared-types = { workspace = true, features = ["openapi"] }
uptrakit-internal-wire = { path = "../../shared/wire" }
uptrakit-plugin-infrastructure-registry = { workspace = true }
uptrakit-command = { workspace = true }
argon2 = { version = "0.5", features = ["std"] }
rand = { workspace = true }
client-ip = { version = "0.2", features = ["forwarded-header"] }
x509-parser = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
uptrakit-web-api-types = { path = "../../shared/web-api-types", features = ["openapi"] }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = "0.2"
openidconnect = { version = "4", optional = true }
url = { workspace = true }
percent-encoding = "2"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
axum-server = { workspace = true }
hostname = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
utoipa-swagger-ui = { version = "9.0", features = ["axum"], optional = true }
x509-ocsp = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
x509-cert = { workspace = true }
const-oid = { workspace = true }
aws-lc-rs = { workspace = true }
parking_lot = "0.12"
tokio-util = { workspace = true }
zeroize = { workspace = true }
async-nats = { workspace = true, optional = true }
uptrakit-nats = { path = "../../shared/nats", optional = true }
uptrakit-notification-channels = { path = "../../shared/notification-channels", default-features = false, features = ["webhook"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tower = { workspace = true }
http-body-util = "0.1"
strum = { workspace = true }
uptrakit-shared-db = { path = "../../shared/db", features = ["migration", "db-sqlite"] }

[lints]
workspace = true
