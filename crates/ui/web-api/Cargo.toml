[package]
name = "uptrakit-web-api"
description = "Uptrakit web-api: HTTP routes, middleware, and AppState"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"

[features]
default = ["oidc"]
oidc = ["uptrakit-web-api-auth/oidc", "uptrakit-web-api-queries/oidc", "dep:openidconnect"]
swagger-ui = ["dep:utoipa-swagger-ui"]
nats = ["dep:async-nats", "dep:uptrakit-nats", "uptrakit-controller-core/nats"]
interactive = []
test-utils = []
dashboard-icons = ["uptrakit-plugin-infrastructure-registry/dashboard-icons"]
notifications-telegram = ["uptrakit-surface-proxy/notifications-telegram"]
notifications-email = ["uptrakit-surface-proxy/notifications-email"]
notifications-all = ["notifications-telegram", "notifications-email"]
db-all = ["db-sqlite", "db-postgres"]
db-sqlite = ["sea-orm/sqlx-sqlite", "uptrakit-web-api-queries/db-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres", "uptrakit-web-api-queries/db-postgres"]
reset-data = []
plugin-ops = ["uptrakit-web-api-queries/plugin-ops", "uptrakit-plugin-infrastructure-registry/plugin-ops"]

[dependencies]
async-stream = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
ipnet = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
time = { workspace = true }
rootcause = { workspace = true }
uptrakit-shared-macros = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
uptrakit-directories = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
uptrakit-shared-db = { workspace = true }
uptrakit-config-merge = { workspace = true }
uptrakit-shared-types = { workspace = true, features = ["openapi", "http-ssrf"] }
uptrakit-wire = { workspace = true }
uptrakit-plugin-infrastructure-registry = { workspace = true, features = ["notifications", "notifications-webhook"] }
uptrakit-command = { workspace = true }
rand = { workspace = true }
client-ip = { workspace = true, features = ["forwarded-header"] }
base64 = { workspace = true }
uptrakit-web-api-types = { workspace = true, features = ["openapi"] }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = { workspace = true }
openidconnect = { workspace = true, optional = true }
reqwest = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
axum-server = { workspace = true }
hostname = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"], optional = true }
x509-ocsp = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
x509-cert = { workspace = true }
const-oid = { workspace = true }
aws-lc-rs = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
tokio-util = { workspace = true }
zeroize = { workspace = true }
async-nats = { workspace = true, optional = true }
uptrakit-nats = { workspace = true, optional = true }
uptrakit-audit-log = { workspace = true, features = ["db"] }
backon = { workspace = true }
uptrakit-web-api-auth = { workspace = true }
uptrakit-web-api-queries = { workspace = true }
hex = { workspace = true }
metrics = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
uptrakit-global-github-provider = { workspace = true }
uptrakit-github-client = { workspace = true }
uptrakit-notification-delivery = { workspace = true }
uptrakit-controller-core = { workspace = true, features = ["axum-integration"] }
uptrakit-service-connections = { workspace = true }
uptrakit-surface-proxy = { workspace = true }
uptrakit-config-reload = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "net"] }
tower = { workspace = true }
http-body-util = { workspace = true }
httpmock = { workspace = true }
metrics-util = { workspace = true }
strum = { workspace = true }
tracing-subscriber = { workspace = true }
uptrakit-shared-db = { workspace = true, features = ["migration", "db-sqlite"] }
uptrakit-surface-proxy = { workspace = true, features = ["testing"] }
uptrakit-controller-core = { workspace = true, features = ["testing"] }
uptrakit-plugin-infrastructure-registry = { workspace = true, features = ["test-support", "migrations"] }
uptrakit-plugin-infrastructure-proxmox = { workspace = true, features = ["testing", "migrations", "db-sqlite"] }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
