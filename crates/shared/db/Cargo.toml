[package]
name = "uptrakit-shared-db"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[features]
default = []
migration   = ["dep:sea-orm-migration"]
db-sqlite   = ["sea-orm/sqlx-sqlite",   "sea-orm-migration?/sqlx-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration?/sqlx-postgres"]
db-mysql    = ["sea-orm/sqlx-mysql",    "sea-orm-migration?/sqlx-mysql"]

[dependencies]
rootcause = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uptrakit-crypto = { path = "../crypto", features = ["sea-orm"] }
uptrakit-shared-macros = { workspace = true }
uptrakit-shared-types = { workspace = true, features = ["sea-orm"] }
uuid = { workspace = true, features = ["v7", "serde"] }
zeroize = { workspace = true }

[dev-dependencies]
sea-orm = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["macros", "rt"] }
