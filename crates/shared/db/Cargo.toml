[package]
name = "uptrakit-shared-db"
description = "Uptrakit shared db: SeaORM entities, migrations, and tenant scoping"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"
publish = ["uptrakit-private"] # fake-registry lock, NOT false: publish = false crates are excluded from cargo package --workspace overlay resolution, breaking release-plz git_only packaging

[features]
default = []
migration   = ["dep:sea-orm-migration"]
db-migrate  = []
db-sqlite   = ["sea-orm/sqlx-sqlite",   "sea-orm-migration?/sqlx-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration?/sqlx-postgres"]

[dependencies]
rootcause = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true, optional = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
uptrakit-db-tx = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-shared-types = { workspace = true, features = ["sea-orm"] }
uptrakit-tenant-db = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
zeroize = { workspace = true }

[dev-dependencies]
sea-orm = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
