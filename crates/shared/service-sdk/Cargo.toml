[package]
name = "uptrakit-service-sdk"
description = "Uptrakit service SDK — lifecycle, identity, TLS, wire protocol, and surface types for Uptrakit-managed services"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.3"
publish = true

[features]
default = ["zeroconf"]
zeroconf = ["dep:uptrakit-zeroconf"]
cli = ["uptrakit-tracing-init/cli"]
test-support = ["uptrakit-tracing-init/test-support"]
sensitive-params = ["dep:aws-lc-rs"]
sea-orm = ["uptrakit-shared-types/sea-orm"]
openapi = ["uptrakit-shared-types/openapi"]
service-migrations = ["dep:sea-orm-migration"]

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true, features = ["async-await-macro"] }
hostname = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
backon = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
directories = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "fs", "signal", "macros"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
sha2 = { workspace = true }
socket2 = { workspace = true }
webpki-roots = { workspace = true }
rustls-native-certs = { workspace = true }
x509-cert = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
strum = { workspace = true }
# Optional (sensitive-params feature only)
aws-lc-rs = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
tempfile = { workspace = true }
uptrakit-build-info = { workspace = true }
uptrakit-tracing-init = { workspace = true }
uptrakit-wire = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-zeroconf = { workspace = true, optional = true }

[dev-dependencies]
cargo_metadata = { workspace = true }
nix = { workspace = true, features = ["signal", "process"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
