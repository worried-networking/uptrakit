[package]
name = "uptrakit-service-sdk"
description = "Uptrakit service SDK — lifecycle, identity, TLS, wire protocol, and surface types for Uptrakit-managed services"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"
publish = true

[features]
default = ["zeroconf"]
zeroconf = ["dep:mdns-sd"]
cli = []
test-support = []
sensitive-params = ["dep:aws-lc-rs"]
# Passthrough features for generated shared_types (sea-orm/openapi gates in source crates)
sea-orm = ["dep:sea-orm"]
openapi = ["dep:utoipa"]
http-ssrf = []
# In workspace builds: use upstream workspace crate types instead of inlined generated copies.
# This prevents type mismatch errors in workspace crates that implement ServiceHandler or use
# wire types alongside workspace types.
workspace-internal = ["dep:uptrakit-wire", "dep:uptrakit-shared-types"]

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true, features = ["async-await-macro"] }
hostname = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
directories = { workspace = true }
tracing-subscriber = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "fs", "signal", "macros"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
sha2 = { workspace = true }
socket2 = { workspace = true }
webpki-roots = { workspace = true }
x509-parser = { workspace = true }
strum = { workspace = true }
# Optional (sensitive-params feature only)
aws-lc-rs = { workspace = true, optional = true }
# Optional passthrough features for generated code
sea-orm = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
# Optional workspace crates (workspace-internal feature)
uptrakit-wire = { workspace = true, optional = true }
uptrakit-shared-types = { workspace = true, optional = true }

[dev-dependencies]
nix = { workspace = true, features = ["signal", "process"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
