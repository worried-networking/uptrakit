[package]
name = "uptrakit-audit-log"
description = "Uptrakit shared audit-log: structured controller-side audit events"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"
publish = false

[features]
default = []
db = ["dep:sea-orm", "dep:uptrakit-shared-db"]
db-sqlite = ["db", "uptrakit-shared-db/db-sqlite"]
db-postgres = ["db", "uptrakit-shared-db/db-postgres"]
journald = ["dep:tracing-journald"]
testing = []

[dependencies]
async-trait = { workspace = true }
parking_lot = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
sea-orm = { workspace = true, optional = true }
uptrakit-shared-db = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["alloc"] }
tracing-journald = { workspace = true, optional = true }
uptrakit-audit-log-derive = { path = "../audit-log-derive", version = "0.0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
trybuild = "1"

[lints]
workspace = true
