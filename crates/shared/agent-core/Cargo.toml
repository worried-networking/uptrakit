[package]
name = "uptrakit-agent-core"
description = "Uptrakit shared agent-core: lifecycle, update execution, plugin glue"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = []
interactive = ["uptrakit-command/interactive"]

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
rootcause = { workspace = true }
uptrakit-shared-macros = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
reqwest = { workspace = true }
serde = { workspace = true }
uptrakit-backoff = { workspace = true }
uptrakit-command = { workspace = true }
uptrakit-wire = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-plugin-infrastructure-registry = { workspace = true, features = ["daemon"] }
uptrakit-service-sdk = { workspace = true }
uptrakit-directories = { workspace = true }

[dev-dependencies]
uptrakit-plugin-infrastructure-core = { workspace = true }
uptrakit-service-sdk = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
