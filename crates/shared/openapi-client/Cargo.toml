[package]
name = "uptrakit-openapi-client"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"
description = "Typed HTTP client for the Uptrakit web API"
publish = true

[features]
## Enables `MockApiServer` and `MockEndpoint` for use in tests of downstream crates.
## Activate with `features = ["mock"]` in `[dev-dependencies]`.
mock = ["dep:httpmock"]
## Enables `#[tracing::instrument]` spans on async methods (tracing is always available).
tracing = []
## Suppresses `unexpected_cfgs` lint for copied web-api-types sources that carry
## `#[cfg_attr(feature = "openapi", derive(utoipa::ToSchema))]`.
openapi = []
## Declared to suppress `unexpected_cfgs` for copied shared-types sources.
## sea-orm integration is not available in the published client.
sea-orm = []
## Declared to suppress `unexpected_cfgs` for copied shared-types sources.
## SSRF-safe resolver is not available in the published client.
http-ssrf = []
## Declared to suppress `unexpected_cfgs` for copied shared-types sources.
## Test helpers are not exposed in the published client.
test-support = []

[dependencies]
reqwest = { workspace = true, features = ["query"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rootcause = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
httpmock = { workspace = true, optional = true }
strum = { workspace = true }
zeroize = { workspace = true }
url = { workspace = true }
time = { workspace = true, features = ["serde"] }
async-trait = { workspace = true }

[dev-dependencies]
http = { workspace = true }
httpmock = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
