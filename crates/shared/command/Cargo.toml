[package]
name = "uptrakit-command"
description = "Uptrakit shared command: process-execution abstraction with PTY support"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"

[features]
default = []
interactive = ["rustix"]
test-support = ["dep:parking_lot"]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
rootcause = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "macros", "time"] }
uptrakit-shared-types = { workspace = true }
rustix = { workspace = true, features = ["pty", "process", "termios", "stdio", "alloc", "std"], optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
rustix = { workspace = true, features = ["pty", "process", "termios", "stdio", "alloc", "std"] }

[lints]
workspace = true
