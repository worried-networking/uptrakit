[package]
name = "uptrakit-db-tx"
description = "Uptrakit transaction opening: begin_immediate(), the workspace's sole transaction opener"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"
publish = ["uptrakit-private"] # fake-registry lock, NOT false: publish = false crates are excluded from cargo package --workspace overlay resolution, breaking release-plz git_only packaging

[dependencies]
sea-orm = { workspace = true }

[dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
