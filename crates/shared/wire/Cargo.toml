[package]
name = "uptrakit-wire"
description = "Uptrakit shared wire protocol: WS, NATS, and REST message types"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.4"
publish = true

[features]
# Emit `schemars::JsonSchema` derives across wire protocol types, shared types,
# and surface types for AsyncAPI schema generation. Off by default.
schema = [
    "dep:schemars",
    "uptrakit-shared-types/schema",
    "uptrakit-surfaces/schema",
]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
uptrakit-shared-types = { workspace = true }
uptrakit-surfaces = { workspace = true }
schemars = { workspace = true, features = ["uuid1", "preserve_order"], optional = true }

[dev-dependencies]
serde_yaml_ng = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
