            Wire protocol version. Must equal `CURRENT_PROTOCOL_VERSION` (currently 1).
            Receivers that encounter an unknown version must close the connection
            with a protocol error.
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Monotonically increasing sequence number for replay protection
        type:
          type: string
          const: mqtt_client_status
          description: Message type discriminator
