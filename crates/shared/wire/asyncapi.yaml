        interactive:
          description: |-
            When `true`, the agent allocates a PTY and keeps stdin open for forwarding.

            Requires the agent to advertise the `InteractiveUpdates` capability.
            Defaults to `false` for backward compatibility with older agents.
          type: boolean
          default: false
