        seq:
          type: integer
          format: int64
          minimum: 1
          description: Monotonically increasing sequence number for replay protection
        type:
          type: string
          const: registered
          description: Message type discriminator
        instance_id:
          type: string
          description: Echo of the instance ID for confirmation
          examples:
            - mqtt-node-1-a1b2c3d4

    mqttReleaseTenantsPayload:
      type: object
      required:
        - protocol_version
