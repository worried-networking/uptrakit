            - "660e8400-e29b-41d4-a716-446655440001"
        status:
          $ref: "#/components/schemas/mqttClientConnectionStatus"
          description: Connection status for the MQTT client

    mqttClientConnectionStatus:
      type: string
      enum:
        - online
        - offline
        - connecting
      description: MQTT client connection status

    mqttTenantAssignmentsPayload:
      type: object
      required:
        - protocol_version
        - seq
        - type
        - tenants
      properties:
        protocol_version:
          type: integer
          format: int32
          minimum: 1
          description: |
