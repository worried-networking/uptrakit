            $ref: '#/components/schemas/HostConnectivityUpdate'
        protocol_version:
          type: integer
          format: uint32
          minimum: 0
        seq:
          type: integer
          format: uint64
          minimum: 0
        trace_context:
          $ref: '#/components/schemas/TraceContext'
      required:
      - type
      - tenant_id
      - updates
      - protocol_version
      - seq
