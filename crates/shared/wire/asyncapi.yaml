            Receivers that encounter an unknown version must close the connection
            with a protocol error.
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Monotonically increasing sequence number for replay protection
        type:
          type: string
          const: tenant_revoked
          description: Message type discriminator
        mqtt_client_id:
          type: string
          format: uuid
          description: MQTT client UUID being revoked
          examples:
            - 660e8400-e29b-41d4-a716-446655440001
        reason:
          type: string
          description: Human-readable reason for the revocation
          examples:
            - MQTT client configuration deleted

    mqttClientCreatedPayload:
      type: object
      required:
        - type
        - mqtt_client_id
      properties:
        type:
          type: string
          const: mqtt_client_created
