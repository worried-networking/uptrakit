        seq:
          type: integer
          format: int64
          minimum: 1
          description: Monotonically increasing sequence number for replay protection
        type:
          type: string
          const: release_tenants
          description: Message type discriminator
        mqtt_client_ids:
          type: array
          items:
            type: string
            format: uuid
          description: MQTT client IDs to release
          examples:
            - ["660e8400-e29b-41d4-a716-446655440001"]

    mqttClientStatusPayload:
      type: object
      required:
        - protocol_version
        - seq
        - type
        - mqtt_client_id
        - status
      properties:
        protocol_version:
          type: integer
          format: int32
          minimum: 1
