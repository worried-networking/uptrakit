[package]
name = "uptrakit-crypto"
description = "Uptrakit shared crypto: encryption-at-rest helpers and EncryptedString"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[features]
sea-orm = ["dep:sea-orm"]
# Expose test-only helpers (e.g. `EncryptedString::plaintext_for_test`) to
# dependent crates' test builds.  Never enable this in production.
testing = []

[dependencies]
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
rootcause = { workspace = true }
sea-orm = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-shared-types = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }

[lints]
workspace = true
