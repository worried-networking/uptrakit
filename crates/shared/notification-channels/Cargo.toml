[package]
name = "uptrakit-notification-channels"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false
description = "Pluggable notification channel implementations for Uptrakit"

[features]
default = ["webhook"]
webhook = []
telegram = []
email = ["dep:lettre"]
all = ["webhook", "telegram", "email"]

[dependencies]
lettre = { workspace = true, features = [
    "smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"
], optional = true }
async-trait = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-shared-types = { workspace = true, features = ["http-ssrf"] }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }

[lints]
workspace = true
