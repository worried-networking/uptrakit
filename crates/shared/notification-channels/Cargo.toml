[package]
name = "uptrakit-notification-channels"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false
description = "Pluggable notification channel implementations for Uptrakit"

[features]
default = ["webhook"]
webhook = []
telegram = []
email = []
all = ["webhook", "telegram", "email"]

[dependencies]
async-trait = { workspace = true }
hmac = "0.12"
reqwest = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-shared-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }

[lints]
workspace = true
