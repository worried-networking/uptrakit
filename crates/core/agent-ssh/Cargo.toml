[package]
name = "uptrakit-agent-ssh"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
clap = { workspace = true }
dirs = "6"
futures-util = { workspace = true }
rootcause = { workspace = true }
rpassword = "7"
russh = { version = "0.57", default-features = false, features = ["aws-lc-rs"] }
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "rand_core", "std"] }
strum = { workspace = true }
uptrakit-shared-macros = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
ssh2-config = "0.7"
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uptrakit-command = { path = "../../shared/command" }
uptrakit-directories = { path = "../../shared/directories" }
uptrakit-service-sdk = { path = "../../shared/service-sdk" }
uptrakit-shared-types = { workspace = true }
uptrakit-crypto = { path = "../../shared/crypto" }
uptrakit-internal-wire = { path = "../../shared/wire" }
uptrakit-build-info = { path = "../../shared/build-info" }
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }
sea-orm-migration = { version = "2.0.0-rc.32", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
uuid = { workspace = true, features = ["v7", "serde"] }
async-trait = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
rcgen = { workspace = true }

[build-dependencies]
uptrakit-build-info = { path = "../../shared/build-info" }
