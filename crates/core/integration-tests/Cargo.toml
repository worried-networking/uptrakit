[package]
name = "uptrakit-integration-tests"
edition = "2024"
publish = false
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dev-dependencies]
# System integration test helpers (containers, API client)
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
testcontainers = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
uptrakit-openapi-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# Reverse proxy integration test helpers
uptrakit-web-api = { workspace = true, features = ["db-all", "oidc", "notifications-all", "interactive", "reset-data"] }
uptrakit-plugin-infrastructure-registry = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["testing"] }
axum = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
time = { workspace = true }
ipnet = { workspace = true }
zeroize = { workspace = true }
sea-orm = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
aws-lc-rs = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
x509-ocsp = { workspace = true }
const-oid = { workspace = true }
rootcause = { workspace = true }

# Database integration test helpers
testcontainers-modules = { workspace = true }
paste = { workspace = true }
uptrakit-shared-db = { workspace = true, features = ["migration", "db-sqlite", "db-postgres"] }
uptrakit-web-api-types = { workspace = true }
uptrakit-audit-log = { workspace = true }
uptrakit-internal-wire = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uptrakit-service-sdk = { workspace = true, default-features = false, features = ["test-support"] }
jsonwebtoken = { workspace = true }

[lints]
workspace = true
