[package]
name = "uptrakit-agent"
description = "Uptrakit agent daemon for local host update management"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["zeroconf", "interactive"]
zeroconf = ["uptrakit-service-sdk/zeroconf"]
interactive = ["uptrakit-agent-runtime/interactive"]

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
rootcause = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time", "net"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uptrakit-agent-runtime = { workspace = true }
uptrakit-audit-log = { workspace = true }
uptrakit-directories = { workspace = true }
uptrakit-wire = { workspace = true }
uptrakit-service-sdk = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }

[build-dependencies]
uptrakit-build-info = { workspace = true }

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/uptrakit-agent-v{ version }/uptrakit-agent-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
