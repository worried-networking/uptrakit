[package]
name = "uptrakit-agent"
description = "Uptrakit agent daemon for local host update management"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["zeroconf"]
zeroconf = ["uptrakit-service-sdk/zeroconf"]

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
rootcause = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time", "net"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uptrakit-agent-core = { workspace = true }
uptrakit-command = { workspace = true }
uptrakit-directories = { workspace = true }
uptrakit-internal-wire = { workspace = true }
uptrakit-service-sdk = { workspace = true }
uptrakit-shared-types = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }

[build-dependencies]
uptrakit-build-info = { workspace = true }

[lints]
workspace = true
