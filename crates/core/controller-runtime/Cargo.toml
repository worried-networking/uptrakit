[package]
name = "uptrakit-controller-runtime"
description = "Uptrakit controller runtime — shared implementation for controller binaries"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["db-sqlite", "oidc", "zeroconf", "interactive", "notifications-all", "embedded-scheduler", "embedded-mqtt", "embedded-frontend", "reset-data", "dashboard-icons"]
embedded-scheduler = ["dep:uptrakit-scheduler-engine", "dep:uptrakit-scheduler-runtime"]
embedded-agent = ["dep:uptrakit-agent-core", "dep:uptrakit-agent-runtime"]
embedded-ssh-agent = ["dep:uptrakit-agent-core", "dep:uptrakit-agent-ssh", "dep:uptrakit-agent-ssh-runtime", "dep:base64"]
embedded-mqtt = ["dep:uptrakit-mqtt-runtime", "dep:base64"]
zeroconf = ["dep:mdns-sd"]
oidc = ["uptrakit-web-api/oidc", "uptrakit-scheduler-engine?/oidc", "uptrakit-scheduler-runtime?/oidc"]
swagger-ui = ["uptrakit-web-api/swagger-ui"]
db-all = ["db-sqlite", "db-postgres", "uptrakit-web-api/db-all"]
db-sqlite = ["sea-orm/sqlx-sqlite", "uptrakit-shared-db/db-sqlite", "uptrakit-web-api/db-sqlite", "uptrakit-scheduler-runtime?/db-sqlite", "dep:sqlx"]
db-postgres = ["sea-orm/sqlx-postgres", "uptrakit-shared-db/db-postgres", "uptrakit-web-api/db-postgres", "uptrakit-scheduler-runtime?/db-postgres"]
interactive = ["uptrakit-web-api/interactive", "uptrakit-agent-runtime?/interactive", "uptrakit-agent-ssh?/interactive"]
nats = ["uptrakit-web-api/nats"]
notifications-telegram = ["uptrakit-web-api/notifications-telegram", "uptrakit-plugin-infrastructure-registry/notifications-telegram"]
notifications-email = ["uptrakit-web-api/notifications-email", "uptrakit-plugin-infrastructure-registry/notifications-email"]
notifications-all = ["notifications-telegram", "notifications-email", "uptrakit-web-api/notifications-all", "uptrakit-plugin-infrastructure-registry/notifications-webhook"]
embedded-frontend = ["dep:uptrakit-frontend"]
journald = ["uptrakit-audit-log/journald", "dep:tracing-journald"]
dashboard-icons = ["uptrakit-web-api/dashboard-icons", "uptrakit-plugin-infrastructure-registry/dashboard-icons"]
reset-data = ["uptrakit-web-api/reset-data", "uptrakit-agent-ssh?/reset-data"]

[dependencies]
uptrakit-wire = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
uptrakit-shared-db = { workspace = true, features = ["migration"] }
uptrakit-web-api = { workspace = true }
uptrakit-directories = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-command = { workspace = true }
uptrakit-tracing-init = { workspace = true }
uptrakit-plugin-infrastructure-registry = { workspace = true, features = ["notifications", "migrations"] }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time"] }
axum = { workspace = true }
axum-server = { workspace = true }
clap = { workspace = true }
ipnet = { workspace = true }
hostname = { workspace = true }
parking_lot = { workspace = true }
rootcause = { workspace = true }
uptrakit-shared-macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
time = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "fs"] }
sea-orm = { workspace = true }
sqlx = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v7", "serde"] }
sha2 = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
nix = { workspace = true, features = ["signal", "process"] }
tokio-util = { workspace = true }
zeroize = { workspace = true }
uptrakit-build-info = { workspace = true }
uptrakit-audit-log = { workspace = true, features = ["db"] }
uptrakit-scheduler-engine = { workspace = true, optional = true }
uptrakit-scheduler-runtime = { workspace = true, optional = true }
uptrakit-agent-core = { workspace = true, optional = true }
uptrakit-agent-runtime = { workspace = true, optional = true }
uptrakit-agent-ssh = { workspace = true, optional = true }
uptrakit-agent-ssh-runtime = { workspace = true, optional = true }
uptrakit-mqtt-runtime = { workspace = true, optional = true }
uptrakit-service-platform = { workspace = true }
base64 = { workspace = true, optional = true }

tracing-journald = { workspace = true, optional = true }
reqwest = { workspace = true }
uptrakit-frontend = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }

[dev-dependencies]
uptrakit-crypto = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = { workspace = true }
sea-orm = { workspace = true, features = ["mock"] }

[build-dependencies]
uptrakit-build-info = { workspace = true }

[lints]
workspace = true
