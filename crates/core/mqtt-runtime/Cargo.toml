[package]
name = "uptrakit-mqtt-runtime"
description = "Uptrakit MQTT bridge runtime for Home Assistant integration"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.4"

[lib]
# ha_discovery examples document pub(crate) helpers (covered by #[cfg(test)] unit tests);
# they can't compile as external-crate doctests. CI/pre-push also pass
# `--exclude uptrakit-mqtt-runtime` because `cargo test --doc` overrides this setting.
# Do not delete this line without also removing those excludes.
doctest = false

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
rootcause = { workspace = true }
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uptrakit-wire = { workspace = true }
uptrakit-service-sdk = { workspace = true, features = ["sensitive-params"] }
uptrakit-shared-macros = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
uptrakit-crypto = { workspace = true }
uptrakit-service-sdk = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
