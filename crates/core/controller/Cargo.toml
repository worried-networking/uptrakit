[package]
name = "uptrakit-controller"
description = "Uptrakit controller — self-hosted software update management server"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["db-sqlite", "oidc", "zeroconf", "interactive"]
embedded-scheduler = ["dep:uptrakit-scheduler-engine"]
zeroconf = ["dep:mdns-sd"]
oidc = ["uptrakit-web-api/oidc", "uptrakit-scheduler-engine?/oidc"]
swagger-ui = ["uptrakit-web-api/swagger-ui"]
db-all = ["db-sqlite", "db-postgres", "db-mysql", "uptrakit-web-api/db-all"]
db-sqlite = ["sea-orm/sqlx-sqlite", "uptrakit-shared-db/db-sqlite", "uptrakit-web-api/db-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres", "uptrakit-shared-db/db-postgres", "uptrakit-web-api/db-postgres"]
db-mysql = ["sea-orm/sqlx-mysql", "uptrakit-shared-db/db-mysql", "uptrakit-web-api/db-mysql"]
interactive = ["uptrakit-web-api/interactive"]
nats = ["uptrakit-web-api/nats"]
notifications-telegram = ["uptrakit-web-api/notifications-telegram"]
notifications-email = ["uptrakit-web-api/notifications-email"]
notifications-all = ["uptrakit-web-api/notifications-all"]
embed-frontend = ["dep:rust-embed"]
journald = ["uptrakit-audit-log/journald", "dep:tracing-journald"]

[dependencies]
uptrakit-internal-wire = { workspace = true }
uptrakit-crypto = { workspace = true, features = ["sea-orm"] }
uptrakit-shared-db = { workspace = true, features = ["migration"] }
uptrakit-web-api = { workspace = true }
uptrakit-directories = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-command = { workspace = true }
uptrakit-notification-plugin-registry = { workspace = true, features = ["webhook"] }
uptrakit-plugin-infrastructure-core = { workspace = true }
uptrakit-plugin-infrastructure-registry = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time"] }
axum = { workspace = true }
axum-server = { workspace = true }
clap = { workspace = true }
ipnet = { workspace = true }
hostname = { workspace = true }
rootcause = { workspace = true }
uptrakit-shared-macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
time = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "fs"] }
sea-orm = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }
sha2 = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
nix = { workspace = true, features = ["signal", "process"] }
tokio-util = { workspace = true }
zeroize = { workspace = true }
uptrakit-build-info = { workspace = true }
uptrakit-audit-log = { workspace = true, features = ["db"] }
uptrakit-scheduler-engine = { workspace = true, optional = true }
tracing-journald = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true, features = ["mime-guess"] }
mdns-sd = { workspace = true, optional = true }

[dev-dependencies]
uptrakit-crypto = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = { workspace = true }
sea-orm = { workspace = true, features = ["mock"] }

[build-dependencies]
uptrakit-build-info = { workspace = true }

[lints]
workspace = true
