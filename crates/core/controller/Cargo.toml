[package]
name = "uptrakit-controller"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["db-sqlite", "oidc"]
oidc = ["uptrakit-web-api/oidc"]
swagger-ui = ["uptrakit-web-api/swagger-ui"]
db-all = ["db-sqlite", "db-postgres", "db-mysql", "uptrakit-web-api/db-all"]
db-sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite", "uptrakit-web-api/db-sqlite"]
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres", "uptrakit-web-api/db-postgres"]
db-mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql", "uptrakit-web-api/db-mysql"]
embed-frontend = ["dep:rust-embed"]

[dependencies]
uptrakit-internal-wire = { path = "../../shared/wire" }
uptrakit-shared-db = { path = "../../shared/db" }
uptrakit-web-api = { path = "../../ui/web-api", default-features = false }
uptrakit-directories = { path = "../../shared/directories" }
uptrakit-shared-types = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time"] }
axum = { workspace = true }
axum-server = { workspace = true }
clap = { workspace = true }
ipnet = { workspace = true }
hostname = { workspace = true }
rootcause = { workspace = true }
uptrakit-shared-macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
time = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "fs"] }
sea-orm = { workspace = true }
sea-orm-migration = { version = "2.0.0-rc.32", default-features = false, features = ["runtime-tokio-rustls"] }
uuid = { workspace = true, features = ["v7", "serde"] }
sha2 = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
tokio-util = { workspace = true }
zeroize = { workspace = true }
uptrakit-build-info = { path = "../../shared/build-info" }
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = "0.27"
reqwest = { workspace = true }
serde = { workspace = true }
base64 = "0.22"
x509-ocsp = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
x509-cert = { workspace = true }
const-oid = { workspace = true }
aws-lc-rs = { workspace = true }
sha1 = "0.10"

[build-dependencies]
uptrakit-build-info = { path = "../../shared/build-info" }
