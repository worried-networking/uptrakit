[package]
name = "uptrakit-mqtt"
description = "Uptrakit MQTT bridge service for Home Assistant integration"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "uptrakit-mqtt"
path = "src/main.rs"

[features]
default = ["zeroconf"]
zeroconf = ["uptrakit-service-sdk/zeroconf"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
rootcause = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uptrakit-mqtt-runtime = { workspace = true }
uptrakit-service-sdk = { workspace = true }
uptrakit-internal-wire = { workspace = true }

[dev-dependencies]

[build-dependencies]
uptrakit-build-info = { workspace = true }

[lints]
workspace = true
