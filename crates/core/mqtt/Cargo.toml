[package]
name = "uptrakit-mqtt"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "uptrakit-mqtt"
path = "src/main.rs"

[features]
default = []

[dependencies]
clap = { workspace = true }
futures-util = { workspace = true }
hostname = { workspace = true }
rcgen = { workspace = true }
rootcause = { workspace = true }
# Required for rcgen CSR verification - ensure verify feature is enabled
x509-parser = { workspace = true }
rumqttc = { version = "0.25.1", features = ["websocket"] }
rustls = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots", "__rustls-tls"] }
tracing = { workspace = true }
url = "2"
rustls-pemfile = { workspace = true }
tracing-subscriber = { workspace = true }
uptrakit-internal-wire = { path = "../../shared/wire" }
uptrakit-web-api-types = { path = "../../shared/web-api-types" }
uuid = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
tempfile = "3"
