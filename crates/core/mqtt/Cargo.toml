[package]
name = "uptrakit-mqtt"
description = "Uptrakit MQTT bridge service for Home Assistant integration"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "uptrakit-mqtt"
path = "src/main.rs"

[features]
default = ["zeroconf"]
zeroconf = ["uptrakit-service-sdk/zeroconf"]

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
hostname = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
uptrakit-shared-macros = { workspace = true }
rumqttc = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uptrakit-service-sdk = { workspace = true }
uptrakit-internal-wire = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }

[build-dependencies]
uptrakit-build-info = { workspace = true }

[lints]
workspace = true
