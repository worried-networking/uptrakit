[package]
name = "uptrakit-mqtt"
description = "Uptrakit MQTT bridge service for Home Assistant integration"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"

[[bin]]
name = "uptrakit-mqtt"
path = "src/main.rs"

[features]
default = ["zeroconf"]
zeroconf = ["uptrakit-service-sdk/zeroconf"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
rootcause = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uptrakit-mqtt-runtime = { workspace = true }
uptrakit-service-sdk = { workspace = true }
uptrakit-wire = { workspace = true }

[dev-dependencies]

[build-dependencies]
uptrakit-build-info = { workspace = true }

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/uptrakit-mqtt-v{ version }/uptrakit-mqtt-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
