[package]
name = "uptrakit-plugin-hook-shell"
description = "Uptrakit hook plugin: run shell commands on lifecycle events"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.4"

[dependencies]
uptrakit-plugin-infrastructure-core = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-command = { workspace = true }
rootcause       = { workspace = true }
async-trait     = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
