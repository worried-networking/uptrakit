[package]
name = "uptrakit-plugin-infrastructure-core"
description = "Uptrakit infrastructure plugin core types and traits"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = []
agent-infra = ["dep:sea-orm", "dep:sea-orm-migration", "migrations"]
catalog = ["dep:reqwest", "dep:tokio-util", "http-client"]
http-client = ["dep:reqwest", "uptrakit-shared-types/http-ssrf"]
migrations = ["dep:sea-orm-migration"]
plugin-ops = ["dep:sea-orm"]
testing = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["parsing"] }
thiserror = { workspace = true }
paste = { workspace = true }
rootcause = { workspace = true }
tracing = { workspace = true }
semver = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uptrakit-command = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-notification-plugin-core = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-surfaces = { workspace = true }
reqwest = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
