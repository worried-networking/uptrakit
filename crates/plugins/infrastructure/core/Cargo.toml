[package]
name = "uptrakit-plugin-infrastructure-core"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[features]
default = []
agent-infra = ["dep:sea-orm", "dep:sea-orm-migration", "dep:uuid", "migrations"]
http-client = ["dep:reqwest", "uptrakit-shared-types/http-ssrf"]
migrations = ["dep:sea-orm-migration"]
plugin-ops = ["dep:sea-orm", "dep:uuid"]
testing = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["parsing"] }
thiserror = { workspace = true }
rootcause = { workspace = true }
tracing = { workspace = true }
semver = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uptrakit-command = { workspace = true }
uptrakit-extension-framework = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-notification-plugin-core = { workspace = true }
uptrakit-shared-types = { workspace = true }
reqwest = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
