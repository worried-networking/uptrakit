[package]
name = "uptrakit-plugin-infrastructure-core"
description = "Uptrakit infrastructure plugin core types and traits"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.3"

[features]
default = []
agent-infra = ["dep:sea-orm", "dep:sea-orm-migration", "migrations"]
catalog = ["dep:reqwest", "dep:tokio-util", "http-client", "dep:uptrakit-shared-db", "dep:uptrakit-crypto"]
http-client = ["dep:reqwest", "uptrakit-shared-types/http-ssrf"]
migrations = [
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:uptrakit-shared-db",
    "uptrakit-shared-db/db-migrate",
]
plugin-ops = ["dep:sea-orm", "dep:uptrakit-tenant-db"]
testing = ["dep:parking_lot"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["parsing"] }
thiserror = { workspace = true }
rootcause = { workspace = true }
tracing = { workspace = true }
semver = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uptrakit-command = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-notification-plugin-core = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-surfaces = { workspace = true }
reqwest = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
uptrakit-tenant-db = { workspace = true, optional = true }
uptrakit-shared-db = { workspace = true, optional = true }
uptrakit-crypto = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
uuid = { workspace = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
httpmock = { workspace = true }

[lints]
workspace = true
