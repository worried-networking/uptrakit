[package]
name = "uptrakit-plugin-infrastructure-proxmox"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[features]
default = []
migrations = ["uptrakit-plugin-infrastructure-core/migrations", "dep:sea-orm-migration"]
agent-infra = [
    "uptrakit-plugin-infrastructure-core/agent-infra",
    "migrations",
    "dep:sea-orm-migration",
]

[dependencies]
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["plugin-ops"] }
uptrakit-shared-types = { workspace = true, features = ["http-ssrf"] }
uptrakit-shared-db = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-command = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
sea-orm = { workspace = true, features = ["mock"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
time = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
sea-orm-migration = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
