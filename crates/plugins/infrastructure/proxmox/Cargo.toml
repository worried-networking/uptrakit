[package]
name = "uptrakit-plugin-infrastructure-proxmox"
description = "Uptrakit infrastructure plugin for Proxmox VE clusters"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.2"

[features]
default = []
migrations = ["uptrakit-plugin-infrastructure-core/migrations", "dep:sea-orm-migration"]
agent-infra = [
    "uptrakit-plugin-infrastructure-core/agent-infra",
    "migrations",
    "dep:sea-orm-migration",
]
db-sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration?/sqlx-sqlite"]
plugin-ops = ["uptrakit-plugin-infrastructure-core/plugin-ops"]
testing = []

[dependencies]
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["plugin-ops"] }
uptrakit-shared-types = { workspace = true, features = ["http-ssrf"] }
# Retained for proxmox_host_mapping entity: that entity cannot move to this crate
# because controller-runtime/db_migrate/tables.rs (a core crate) uses the SeaORM
# entity type for migration — adding a plugin dep to a core crate is not allowed.
uptrakit-shared-db = { workspace = true }
uptrakit-tenant-db = { workspace = true }
uptrakit-shared-macros = { workspace = true }
uptrakit-command = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
sea-orm = { workspace = true, features = ["mock"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
time = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
sea-orm-migration = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dependency (cargo explicitly permits dev-dep cycles onto the package
# itself): enables this crate's own features for its test/bench targets only.
# Required because the dev-dep on infrastructure-core below enables core's
# `agent-infra` -> `migrations`, which switches core's descriptor fn-pointer
# aliases to their real signatures; without the matching proxmox features the
# `#[cfg(not(feature = "migrations"))]` stubs in reset.rs/db_migrate.rs/plugin.rs
# fail to type-check (E0308). Deleting this line re-breaks every bare
# `cargo test|clippy -p uptrakit-plugin-infrastructure-proxmox` invocation.
# Lib-only builds (production consumers, agent binaries, `cargo check -p`) are
# unaffected: resolver v3 does not unify dev-dep features for them.
# Interim mitigation — retire together with the dependency-policy rule when the
# infra-core feature-switched aliases become additive (deferred restructure spec).
# Deliberately `path`-only (no `workspace = true`/version): a versionless dev-dep
# is stripped from the packaged manifest, so `cargo package --workspace` never
# tries to resolve this crate against itself (which fails — the package is not
# in the registry overlay while being packaged).
uptrakit-plugin-infrastructure-proxmox = { path = ".", features = ["agent-infra", "plugin-ops", "db-sqlite", "testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
httpmock = { workspace = true }
uptrakit-shared-db = { workspace = true, features = ["migration", "db-sqlite"] }
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["testing", "agent-infra"] }
uptrakit-crypto = { workspace = true }
uptrakit-command = { workspace = true, features = ["test-support"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
tempfile = { workspace = true }

[lints]
workspace = true
