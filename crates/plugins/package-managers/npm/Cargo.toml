[package]
name = "uptrakit-plugin-package-manager-npm"
description = "Uptrakit package-manager plugin for Node.js npm global packages"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.3"

[dependencies]
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["http-client"] }
uptrakit-shared-macros = { workspace = true }
backon = { workspace = true }
rootcause = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }

[dev-dependencies]
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
uptrakit-command = { workspace = true }
httpmock = { workspace = true }

[lints]
workspace = true
