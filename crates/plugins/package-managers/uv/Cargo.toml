[package]
name = "uptrakit-plugin-package-manager-uv"
description = "Uptrakit package-manager plugin for Python CLI tools installed via uv tool"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version = "0.0.1"

[dependencies]
uptrakit-plugin-infrastructure-core = { workspace = true }
uptrakit-shared-types = { workspace = true }
rootcause = { workspace = true }
thiserror = { workspace = true }
uptrakit-shared-macros = { workspace = true }
async-trait = { workspace = true }
pep440_rs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["testing"] }
uptrakit-command = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
