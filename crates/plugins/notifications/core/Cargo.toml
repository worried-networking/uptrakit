description = "Core types for notification plugins"

[features]
default = []
channel_admin = ["dep:sea-orm", "dep:uptrakit-shared-db", "dep:uuid", "dep:tracing"]

[dependencies]
rootcause = { workspace = true }
serde = { workspace = true }
