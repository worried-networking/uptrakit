[package]
name = "uptrakit-notification-plugin-webhook"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false
description = "Webhook notification plugin for Uptrakit"

[dependencies]
async-trait = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uptrakit-notification-plugin-core = { workspace = true, features = ["extensions"] }
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["plugin-ops"] }
uptrakit-shared-db = { workspace = true }
uptrakit-shared-types = { workspace = true, features = ["http-ssrf"] }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }

[lints]
workspace = true
