[package]
name = "uptrakit-notification-plugin-email"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
description = "Email (SMTP) notification plugin for Uptrakit"

[dependencies]
async-trait = { workspace = true }
mail-builder = { workspace = true }
mail-send = { workspace = true, features = ["builder", "aws_lc_rs"] }
rootcause = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uptrakit-crypto = { workspace = true }
uptrakit-shared-types = { workspace = true }
uptrakit-notification-plugin-core = { workspace = true, features = ["channel_admin"] }
uptrakit-plugin-infrastructure-core = { workspace = true, features = ["plugin-ops"] }
uptrakit-shared-db = { workspace = true }
uptrakit-tenant-db = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }

[lints]
workspace = true
