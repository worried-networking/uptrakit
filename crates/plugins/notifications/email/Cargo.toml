[package]
name = "uptrakit-notification-plugin-email"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false
description = "Email (SMTP) notification plugin for Uptrakit"

[dependencies]
async-trait = { workspace = true }
lettre = { workspace = true, features = [
    "smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"
] }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uptrakit-notification-plugin-core = { path = "../core" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }

[lints]
workspace = true
