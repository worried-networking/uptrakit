[package]
name = "uptrakit-notification-plugin-registry"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true
publish = false
description = "Notification plugin registry and NotificationOps trait for Uptrakit"

[features]
default = ["webhook"]
webhook = ["dep:uptrakit-notification-plugin-webhook"]
telegram = ["dep:uptrakit-notification-plugin-telegram"]
email = ["dep:uptrakit-notification-plugin-email"]
all = ["webhook", "telegram", "email"]

[dependencies]
async-trait = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uptrakit-notification-plugin-core = { workspace = true }
uptrakit-notification-plugin-webhook = { workspace = true, optional = true }
uptrakit-notification-plugin-telegram = { workspace = true, optional = true }
uptrakit-notification-plugin-email = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }

[lints]
workspace = true
