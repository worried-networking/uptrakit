name: Generated files

on:
  push:
    branches: [main]
    paths:
      - "crates/shared/wire/**"
      - "crates/shared/surfaces/**"
      - "crates/shared/types/**"
      - "crates/shared/web-api-types/**"
      - "crates/shared/service-sdk/src/generated/**"
      - "crates/shared/openapi-client/src/generated/**"
      - "xtask/**"
  pull_request:
    paths:
      - "crates/shared/wire/**"
      - "crates/shared/surfaces/**"
      - "crates/shared/types/**"
      - "crates/shared/web-api-types/**"
      - "crates/shared/service-sdk/src/generated/**"
      - "crates/shared/openapi-client/src/generated/**"
      - "xtask/**"

jobs:
  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check service-sdk generated types are up to date
        run: cargo xtask sync-sdk --check
      - name: Check openapi-client generated types are up to date
        run: cargo xtask sync-openapi-client --check
