name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/end-user/**'
      - 'docs/security/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/end-user/**'
      - 'docs/security/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Building the site touches nothing outside the runner, so superseded builds
    # are cancellable per ref. main is exempt: its build feeds the deploy job
    # below, and every commit that reaches production keeps its own verdict.
    concurrency:
      group: website-build-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.3

      - name: Validate site
        run: zola check
        working-directory: website

      - name: Build site
        # GITHUB_SHA is auto-set by Actions runners; mapping it explicitly here makes
        # the contract with base.html (`get_env(name="GITHUB_SHA")`) self-documenting.
        # zola emits to its default output dir `public/` inside `website/`, so every
        # subsequent step that touches the artifact runs with `working-directory: website`
        # (or references `website/public` from repo root) for consistency.
        run: zola build
        working-directory: website
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Build search index
        # pagefind is not in taiki-e/install-action's registry; invoke via npx.
        # Ubuntu runners ship Node 20+, no extra setup step needed.
        # @1 pins the major version; bump is a one-line PR when pagefind v2 warrants it.
        run: npx -y pagefind@1 --site public
        working-directory: website

      - name: Guard artifact size
        working-directory: website
        run: |
          size=$(du -sb public | cut -f1)
          limit=$((10 * 1024 * 1024))
          if [ "$size" -gt "$limit" ]; then
            echo "Artifact size $size exceeds 10MB limit"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GitHub Pages allows one in-flight deployment per site, so this stays a
    # single global group with cancellation off — a cancelled deploy-pages run
    # can leave the Pages environment locked mid-publish. Only the deploy job
    # carries it now; PR builds no longer queue behind a production deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
