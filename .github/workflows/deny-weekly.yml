name: deny-weekly

on:
  schedule:
    - cron: "23 4 * * 1"  # Mondays 04:23 UTC
  workflow_dispatch:

jobs:
  deny-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4
      - run: bash scripts/check_deny.sh
