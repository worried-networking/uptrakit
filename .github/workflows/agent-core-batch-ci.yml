name: agent-core-batch-ci

on:
  push:
  pull_request:

# Same rationale as ci.yml: release-plz pushes several commits to a release
# branch back to back, and only the branch head is worth testing. Superseded
# runs are cancelled everywhere except main, which keeps a verdict per merge.
concurrency:
  group: agent-core-batch-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  agent-core-batch-failure-path:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - name: Run supplementary batch_check_versions failure-path tests
        run: cargo test -p uptrakit-agent-core --all-features batch_check_versions_
