name: docker

on:
  push:
    branches: [main]
    tags: ["uptrakit-*-v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/worried-networking

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci --ignore-scripts && npm rebuild && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1

  build:
    needs: [build-frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # controller
          - name: controller
            runner: ubuntu-latest
            platform: linux/amd64
            package: uptrakit-controller
            binary: uptrakit-controller
            features: embed-frontend,db-all,oidc,embedded-scheduler,nats,notifications-all
          - name: controller
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            package: uptrakit-controller
            binary: uptrakit-controller
            features: embed-frontend,db-all,oidc,embedded-scheduler,nats,notifications-all
          # scheduler
          - name: scheduler
            runner: ubuntu-latest
            platform: linux/amd64
            package: uptrakit-scheduler
            binary: uptrakit-scheduler
            features: db-all,oidc
          - name: scheduler
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            package: uptrakit-scheduler
            binary: uptrakit-scheduler
            features: db-all,oidc
          # mqtt
          - name: mqtt
            runner: ubuntu-latest
            platform: linux/amd64
            package: uptrakit-mqtt
            binary: uptrakit-mqtt
            features: ""
          - name: mqtt
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            package: uptrakit-mqtt
            binary: uptrakit-mqtt
            features: ""
          # agent-ssh
          - name: agent-ssh
            runner: ubuntu-latest
            platform: linux/amd64
            package: uptrakit-agent-ssh
            binary: uptrakit-agent-ssh
            features: ""
          - name: agent-ssh
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            package: uptrakit-agent-ssh
            binary: uptrakit-agent-ssh
            features: ""
          # cli
          - name: cli
            runner: ubuntu-latest
            platform: linux/amd64
            package: uptrakit-cli
            binary: uptrakit
            features: ""
          - name: cli
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            package: uptrakit-cli
            binary: uptrakit
            features: ""

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          # Mirrors the path Dockerfile expects: COPY --from=frontend-builder /app/frontend/build
          path: /tmp/frontend-ctx/app/frontend/build

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/uptrakit-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          provenance: false
          build-args: |
            PACKAGE=${{ matrix.package }}
            BINARY=${{ matrix.binary }}
            FEATURES=${{ matrix.features }}
          build-contexts: |
            frontend-builder=/tmp/frontend-ctx
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.name }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # controller-swagger is tag-only; kept as a separate job to avoid matrix context
  # limitations in job-level if conditions.
  build-swagger:
    needs: [build-frontend]
    if: startsWith(github.ref, 'refs/tags/uptrakit-controller-v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: /tmp/frontend-ctx/app/frontend/build

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/uptrakit-controller-swagger,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            PACKAGE=uptrakit-controller
            BINARY=uptrakit-controller
            FEATURES=embed-frontend,db-all,oidc,embedded-scheduler,nats,notifications-all,swagger-ui
          build-contexts: |
            frontend-builder=/tmp/frontend-ctx
          cache-from: type=gha,scope=controller-swagger-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=controller-swagger-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-controller-swagger-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [controller, scheduler, mqtt, agent-ssh, cli]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/uptrakit-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, format('refs/tags/uptrakit-{0}-v', matrix.name)) }}
            type=match,pattern=uptrakit-${{ matrix.name }}-v(.+),group=1
            type=match,pattern=uptrakit-${{ matrix.name }}-v(\d+\.\d+),group=1
            type=match,pattern=uptrakit-${{ matrix.name }}-v(\d+),group=1
            type=sha
            type=ref,event=branch

      - name: Create manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}/uptrakit-${{ matrix.name }}@sha256:%s ' *)

  merge-swagger:
    needs: [build-swagger]
    if: startsWith(github.ref, 'refs/tags/uptrakit-controller-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-controller-swagger-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/uptrakit-controller-swagger
          tags: |
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/uptrakit-controller-v') }}
            type=match,pattern=uptrakit-controller-v(.+),group=1
            type=match,pattern=uptrakit-controller-v(\d+\.\d+),group=1
            type=match,pattern=uptrakit-controller-v(\d+),group=1
            type=sha

      - name: Create manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}/uptrakit-controller-swagger@sha256:%s ' *)
