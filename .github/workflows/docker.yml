name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/worried-networking

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            package: uptrakit-controller
            binary: uptrakit-controller
            features: embed-frontend,db-all,oidc,embedded-scheduler,nats,notifications-all
          - name: controller-swagger
            package: uptrakit-controller
            binary: uptrakit-controller
            features: embed-frontend,db-all,oidc,embedded-scheduler,nats,notifications-all,swagger-ui
          - name: scheduler
            package: uptrakit-scheduler
            binary: uptrakit-scheduler
            features: db-all,oidc
          - name: mqtt
            package: uptrakit-mqtt
            binary: uptrakit-mqtt
            features: ""
          - name: agent-ssh
            package: uptrakit-agent-ssh
            binary: uptrakit-agent-ssh
            features: ""
          - name: cli
            package: uptrakit-cli
            binary: uptrakit
            features: ""

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/uptrakit-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            BINARY=${{ matrix.binary }}
            FEATURES=${{ matrix.features }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
