name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.mjs

  markdown:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install -g markdownlint-cli
      - run: markdownlint --config .markdownlint.json '**/*.md'

  backend-fmt:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  backend-deny:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4
      - name: cargo deny check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check_deny.sh "origin/${{ github.base_ref }}"
          else
            bash scripts/check_deny.sh
          fi

  semantic-boundary:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y ripgrep
      - run: python3 -m unittest ci/test_check_plugin_semantic_boundary.py
      - run: python3 ci/check_plugin_semantic_boundary.py
      - run: bash ci/verify_no_security_audit.sh
      - run: bash ci/verify_typed_audit_actions.sh

  backend-lint:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
      - run: cargo check --no-default-features --features db-sqlite
      - run: cargo check --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features db-sqlite -- -D warnings
      - name: Check legacy error-match patterns
        run: ./scripts/check_legacy_error_matches.sh
      - name: Audit coverage check
        run: cargo run -p audit-coverage-check

  backend-test:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - run: cargo test --all-features
      - name: Verify handler state contract (routes/ only)
        run: bash ci/verify_handler_state_contract.sh
      - name: Verify DB access policy (routes/ only)
        run: python3 ci/verify_db_access_policy.py

  reverse-proxy-tests:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - run: cargo test -p uptrakit-integration-tests --test reverse_proxy -- --ignored

  system-integration-tests:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - uses: docker/setup-buildx-action@v4
      - name: Build test Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          push: false
          load: true
          tags: uptrakit-test:latest
          cache-from: type=gha,scope=integration-test
          cache-to: type=gha,mode=max,scope=integration-test
      - name: Run system integration tests
        run: cargo test -p uptrakit-integration-tests -- --ignored

  database-integration-tests:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - name: Run database integration tests
        run: cargo test -p uptrakit-integration-tests --test database -- --ignored

  sentrux:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install sentrux
        run: curl -fsSL https://raw.githubusercontent.com/sentrux/sentrux/main/install.sh | sh
      - run: sentrux check . || true

  frontend:
    runs-on:
      - ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test
      - run: npm run build

  frontend-e2e-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend_changed: ${{ steps.changes.outputs.frontend }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e:check-buckets

  frontend-e2e-behavior:
    needs: frontend-e2e-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:behavior
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-behavior
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  frontend-e2e-parity:
    needs: frontend-e2e-preflight
    # macOS minutes are ~10x ubuntu — skip when no frontend/CI files changed,
    # but always run on pushes to main as a post-merge canary to catch the
    # rare case where a backend change indirectly broke parity (shared asset,
    # generated API client) without touching frontend/**.
    if: |
      github.ref == 'refs/heads/main' ||
      needs.frontend-e2e-preflight.outputs.frontend_changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e:parity
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-parity
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
