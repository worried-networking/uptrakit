name: ci

on:
  push:
  pull_request:

jobs:
  markdown:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install -g markdownlint-cli
      - run: markdownlint --config .markdownlint.json '**/*.md'

  backend-fmt:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  backend-deny:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  backend-lint:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
      - run: cargo check --no-default-features --features db-sqlite
      - run: cargo check --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features db-sqlite -- -D warnings

  backend-test:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - run: cargo test --all-features

  reverse-proxy-tests:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - run: cargo test -p uptrakit-integration-tests --test reverse_proxy -- --ignored

  system-integration-tests:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - uses: docker/setup-buildx-action@v4
      - name: Build test Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          push: false
          load: true
          tags: uptrakit-test:latest
          cache-from: type=gha,scope=integration-test
          cache-to: type=gha,mode=max,scope=integration-test
      - name: Run system integration tests
        run: cargo test -p uptrakit-integration-tests -- --ignored

  frontend:
    runs-on:
      - ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test
      - run: npm run build
