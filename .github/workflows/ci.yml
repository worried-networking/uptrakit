name: ci

on:
  push:
    branches: ['**']
  pull_request:

# The release-plz workflow pushes up to three commits to a release branch in
# quick succession (version bump, frontend version bump, asyncapi regeneration).
# Without a concurrency group each push spawns a full CI run, and the runs on
# the intermediate SHAs report failures for state that is already fixed at the
# branch head (e.g. the asyncapi_yaml_is_up_to_date golden test). Superseded
# runs are cancelled everywhere except main, where every merge commit keeps its
# own verdict. Push and pull_request events land in different groups because
# github.ref differs (refs/heads/* vs refs/pull/*/merge), so they never cancel
# each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.mjs

  markdown:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install -g markdownlint-cli
      - run: markdownlint --config .markdownlint.json '**/*.md'
      - uses: taiki-e/install-action@v2
        with:
          tool: adrs@0.10.1
      - name: adrs doctor
        run: adrs doctor
      - name: ADR TOC staleness
        run: bash scripts/regen-adr-toc.sh --check

  backend-fmt:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  backend-deny:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check_deny.sh "origin/${{ github.base_ref }}"
          else
            bash scripts/check_deny.sh
          fi

  semantic-boundary:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y ripgrep
      - run: python3 -m unittest ci/test_check_plugin_semantic_boundary.py
      - run: python3 -m unittest ci/test_verify_action_security_declarations.py
      - run: python3 ci/check_plugin_semantic_boundary.py
      - run: bash ci/verify_no_legacy_identifiers.sh
      - run: bash ci/verify_typed_audit_actions.sh
      - run: bash ci/verify_no_inline_query_params.sh
      - run: bash ci/verify_dataload_declares_params.sh
      - run: bash ci/verify_no_new_cfg_not_feature.sh
      - run: bash ci/verify_engine_owned_entities.sh
      - run: python3 ci/verify_action_security_declarations.py
      - run: bash ci/verify_agents_md_budget.sh
      - run: bash ci/test_verify_no_raw_body_extractors.sh
      # fetch-depth: 0 + per-event BASE_REF are load-bearing for the gate's
      # history check; a named BASE_REF that fails to resolve HARD-FAILS by
      # design (do not "fix" a checkout hiccup by relaxing the hard fail —
      # an explicitly requested baseline must never fail open).
      - name: Verify no raw body extractors (routes/ only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash ci/verify_no_raw_body_extractors.sh "origin/${{ github.base_ref }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bash ci/verify_no_raw_body_extractors.sh "${{ github.event.before }}"
          else
            bash ci/verify_no_raw_body_extractors.sh
          fi

  backend-lint:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
      - run: python3 -m unittest ci/test_verify_no_orphan_modules.py
      - run: python3 ci/verify_no_orphan_modules.py
      - run: cargo check --no-default-features --features db-sqlite
      - run: cargo check --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features db-sqlite -- -D warnings
      # Zero-embedded controller-runtime check in package isolation. The workspace
      # minimal gate above unifies features across members and enables ALL embedded-*
      # features on controller-runtime, so it never exercises the zero-embedded state
      # that the release image build (`cargo build -p uptrakit-controller`, no embedded
      # readers) actually compiles. This `-p` check reproduces that isolation and guards
      # the shutdown-token cfg gating in controller-runtime/src/embedded/mod.rs against
      # dead-code / unfulfilled-lint drift on the zero-embedded path.
      - run: cargo check -p uptrakit-controller-runtime --no-default-features --features db-sqlite
      # Bare per-crate clippy sweep over every plugin crate. Workspace-level
      # gates unify features across all members (including dev-dep feature
      # unification), so they never compile a plugin crate's own bare feature
      # world; a desync between a crate's cfg(not(feature)) fallbacks and a
      # dependency's feature-switched types is visible ONLY in isolated -p
      # builds (proxmox E0308 incident, 2026-07-20 spec). Crate list is derived
      # from the two-level plugin layout glob — never hand-maintained.
      - name: Bare-crate clippy sweep (plugin crates)
        run: |
          for manifest in crates/plugins/*/*/Cargo.toml; do
            crate=$(grep -m1 '^name' "$manifest" | sed 's/.*"\(.*\)"/\1/')
            echo "::group::${crate}"
            cargo clippy --all-targets -p "$crate" -- -D warnings
            echo "::endgroup::"
          done
      - name: Check legacy error-match patterns
        run: ./scripts/check_legacy_error_matches.sh
      - name: Audit coverage check
        run: cargo xtask audit-coverage-check
      - name: OpenAPI client coverage
        run: cargo xtask openapi-client-check
      # ADR-0032 Layer B: cross-build contribution superset diff. Two nested
      # cargo builds; baseline uses its own target dir (see xtask module) so
      # it does not thrash the all-features cache.
      - name: Contribution monotonicity check
        run: cargo xtask contribution-monotonicity-check

  backend-test:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      # cargo-llvm-cov runs the full test suite under instrumentation (replaces the
      # plain `cargo test --all-features` gate). default-members is unset, so
      # `--workspace` selects the same packages the old bare `cargo test` did.
      - name: Test + coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      # Doctests are not instrumented by cargo-llvm-cov on stable; run them separately
      # so doctest execution (part of the old `cargo test` gate) is preserved.
      - name: Doctests
        # cargo test --doc overrides a crate's `[lib] doctest = false`; uptrakit-mqtt-runtime
        # opts out (its ha_discovery examples document pub(crate) helpers, covered by unit tests).
        run: cargo test --workspace --all-features --doc --exclude uptrakit-mqtt-runtime
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
      # No CodeScene coverage upload: its coverage import needs an API access token,
      # which the CodeScene open-source plan does not provide. CodeScene still runs as
      # a source + git-history dashboard; coverage lives in Codecov only.
      - name: Verify handler state contract (routes/ only)
        run: bash ci/verify_handler_state_contract.sh
      - name: Verify DB access policy (routes/ only)
        run: python3 ci/verify_db_access_policy.py
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps for client regen check
        run: npm ci
        working-directory: frontend
      - name: OpenAPI spec and generated client are up to date
        run: |
          UPDATE_OPENAPI=1 cargo test -p uptrakit-web-api --all-features openapi_
          ( cd frontend && npm run gen:api )
          git diff --exit-code crates/ui/web-api/openapi.json frontend/src/lib/api/generated \
            || { echo "::error::openapi.json or the generated client is stale. Run: ./scripts/regen-api.sh"; exit 1; }

  reverse-proxy-tests:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - run: cargo test -p uptrakit-integration-tests --test reverse_proxy -- --ignored

  system-integration-tests:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - uses: docker/setup-buildx-action@v4
      - name: Build test Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          push: false
          load: true
          tags: uptrakit-test:latest
          cache-from: type=gha,scope=integration-test
          cache-to: type=gha,mode=max,scope=integration-test
      - name: Run system integration tests
        run: cargo test -p uptrakit-integration-tests -- --ignored

  database-integration-tests:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-all-features"
          save-if: "false"
      - name: Run database integration tests
        run: cargo test -p uptrakit-integration-tests --test database -- --ignored

  unused-deps:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - name: cargo machete (advisory)
        run: cargo machete
        continue-on-error: true

  frontend:
    runs-on:
      - ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test
      - run: npm run build

  frontend-e2e-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend_changed: ${{ steps.changes.outputs.frontend }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e:check-buckets

  frontend-e2e-behavior:
    needs: frontend-e2e-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:behavior
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-behavior
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  frontend-e2e-parity:
    needs: frontend-e2e-preflight
    # macOS minutes are ~10x ubuntu — skip when no frontend/CI files changed,
    # but always run on pushes to main as a post-merge canary to catch the
    # rare case where a backend change indirectly broke parity (shared asset,
    # generated API client) without touching frontend/**.
    if: |
      github.ref == 'refs/heads/main' ||
      needs.frontend-e2e-preflight.outputs.frontend_changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e:parity
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-parity
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
