name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      tag: ${{ steps.controller.outputs.tag }}
      version: ${{ steps.controller.outputs.version }}
      released: ${{ steps.controller.outputs.released }}
      any_binary_released: ${{ steps.any_binary.outputs.released }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Extract controller release
        id: controller
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(echo "${RELEASES:-[]}" | jq -r \
            '(.[] | select(.package_name | IN(
              "uptrakit-controller","uptrakit-controller-standalone"
            )) | .tag) // empty' | head -1)
          version=$(echo "${RELEASES:-[]}" | jq -r \
            '(.[] | select(.package_name | IN(
              "uptrakit-controller","uptrakit-controller-standalone"
            )) | .version) // empty' | head -1)
          if [ -n "$tag" ]; then
            {
              echo "tag=$tag"
              echo "version=$version"
              echo "released=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check any binary released
        id: any_binary
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          count=$(echo "${RELEASES:-[]}" | jq '[.[] | select(.package_name | IN(
            "uptrakit-controller","uptrakit-controller-standalone",
            "uptrakit-agent","uptrakit-agent-ssh",
            "uptrakit-mqtt","uptrakit-scheduler","uptrakit-cli"
          ))] | length')
          if [ "$count" -gt "0" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Bump frontend package.json version
        if: ${{ steps.release-plz.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          HEAD_BRANCH=$(echo "$PR_JSON" | jq -r '.head_branch')
          VERSION=$(echo "$PR_JSON" | jq -r \
            '(.releases // [])[] | select(.package_name | IN(
              "uptrakit-controller","uptrakit-controller-standalone"
            )) | .version' | head -1)
          if [ -z "$VERSION" ]; then
            echo "uptrakit-controller not in this release PR, skipping"
            exit 0
          fi
          git fetch origin "$HEAD_BRANCH"
          git checkout "$HEAD_BRANCH"
          CURRENT=$(node -p "require('./frontend/package.json').version")
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json already at $VERSION"
            exit 0
          fi
          npm --prefix frontend version --no-git-tag-version "$VERSION"
          git add frontend/package.json
          git commit -m "chore: bump frontend version to $VERSION"
          git push origin "$HEAD_BRANCH"

  build-frontend:
    needs: release-plz
    if: ${{ needs.release-plz.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1

  build-artifacts:
    needs: [release-plz, build-frontend]
    if: >-
      ${{
        always() &&
        needs.release-plz.result == 'success' &&
        (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
        needs.release-plz.outputs.any_binary_released == 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
    runs-on: ${{ matrix.runner }}
    env:
      RELEASES: ${{ needs.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - uses: actions/download-artifact@v8
        if: ${{ needs.release-plz.outputs.released == 'true' }}
        with:
          name: frontend-build
          path: frontend/build

      - name: Set cargo command
        id: cargo-cmd
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            echo "cmd=cross" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=cargo" >> "$GITHUB_OUTPUT"
          fi

      # --- controller (lean: no embedded services, with frontend) ---
      - name: Build controller
        if: ${{ needs.release-plz.outputs.released == 'true' }}
        env:
          UPTRAKIT_RELEASE_NAME: uptrakit-controller
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release \
            --target ${{ matrix.target }} \
            -p uptrakit-controller \
            --features db-all,nats
          cp target/${{ matrix.target }}/release/uptrakit-controller \
            uptrakit-controller-${{ matrix.target }}

      # --- controller-standalone (all-in-one: embedded scheduler + mqtt + frontend) ---
      - name: Build controller-standalone
        if: ${{ needs.release-plz.outputs.released == 'true' }}
        env:
          UPTRAKIT_RELEASE_NAME: uptrakit-controller-standalone
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release \
            --target ${{ matrix.target }} \
            -p uptrakit-controller-standalone \
            --features db-all,nats
          cp target/${{ matrix.target }}/release/uptrakit-controller-standalone \
            uptrakit-controller-standalone-${{ matrix.target }}

      # --- agent ---
      - name: Build agent
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-agent
          cp target/${{ matrix.target }}/release/uptrakit-agent uptrakit-agent-${{ matrix.target }}

      # --- agent-ssh ---
      - name: Build agent-ssh
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-agent-ssh
          cp target/${{ matrix.target }}/release/uptrakit-agent-ssh uptrakit-agent-ssh-${{ matrix.target }}

      # --- mqtt ---
      - name: Build mqtt
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-mqtt
          cp target/${{ matrix.target }}/release/uptrakit-mqtt uptrakit-mqtt-${{ matrix.target }}

      # --- scheduler ---
      - name: Build scheduler
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-scheduler --no-default-features \
            --features db-all,oidc
          cp target/${{ matrix.target }}/release/uptrakit-scheduler uptrakit-scheduler-${{ matrix.target }}

      # --- cli ---
      - name: Build cli
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-cli
          cp target/${{ matrix.target }}/release/uptrakit uptrakit-cli-${{ matrix.target }}

      # --- upload to respective releases ---
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          upload_if_released() {
            local pkg="$1"
            local file="$2"
            local tag
            tag=$(echo "$RELEASES" | jq -r --arg pkg "$pkg" '(.[] | select(.package_name == $pkg) | .tag) // empty')
            if [ -n "$tag" ] && [ -f "$file" ]; then
              gh release upload "$tag" "$file"
            fi
          }
          upload_if_released "uptrakit-controller"  "uptrakit-controller-${TARGET}"
          upload_if_released "uptrakit-controller-standalone"  "uptrakit-controller-standalone-${TARGET}"
          upload_if_released "uptrakit-agent"       "uptrakit-agent-${TARGET}"
          upload_if_released "uptrakit-agent-ssh"   "uptrakit-agent-ssh-${TARGET}"
          upload_if_released "uptrakit-mqtt"        "uptrakit-mqtt-${TARGET}"
          upload_if_released "uptrakit-scheduler"   "uptrakit-scheduler-${TARGET}"
          upload_if_released "uptrakit-cli"         "uptrakit-cli-${TARGET}"

      # --- attestation ---
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "uptrakit-*-${{ matrix.target }}"
