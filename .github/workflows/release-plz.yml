name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump frontend package.json version
        if: ${{ steps.release-plz.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          HEAD_BRANCH=$(echo "$PR_JSON" | jq -r '.head_branch')
          VERSION=$(echo "$PR_JSON" | jq -r '.releases[] | select(.package_name == "uptrakit-controller") | .version')
          if [ -z "$VERSION" ]; then
            echo "uptrakit-controller not in this release PR, skipping"
            exit 0
          fi
          git fetch origin "$HEAD_BRANCH"
          git checkout "$HEAD_BRANCH"
          npm --prefix frontend version --no-git-tag-version "$VERSION"
          if git diff --quiet frontend/package.json; then
            echo "package.json already at $VERSION"
          else
            git add frontend/package.json
            git commit -m "chore: bump frontend version to $VERSION"
            git push origin "$HEAD_BRANCH"
          fi

  build-frontend:
    needs: release-plz
    if: ${{ fromJson(needs.release-plz.outputs.releases)[0] != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1

  build-artifacts:
    needs: [release-plz, build-frontend]
    if: ${{ fromJson(needs.release-plz.outputs.releases)[0] != null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-13
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
    runs-on: ${{ matrix.runner }}
    env:
      TAG_NAME: ${{ fromJson(needs.release-plz.outputs.releases)[0].tag }}
      VERSION: ${{ fromJson(needs.release-plz.outputs.releases)[0].version }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/build

      - name: Set cargo command
        id: cargo-cmd
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            echo "cmd=cross" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=cargo" >> "$GITHUB_OUTPUT"
          fi

      # --- controller (all-in-one: embedded scheduler + mqtt + frontend) ---
      - name: Build controller
        env:
          UPTRAKIT_RELEASE_NAME: uptrakit-controller
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-controller \
            --features embed-frontend,db-all,oidc,embedded-scheduler,embedded-mqtt,nats,notifications-all,zeroconf,interactive,reset-data,dashboard-icons
          cp target/${{ matrix.target }}/release/uptrakit-controller uptrakit-controller-${{ env.TAG_NAME }}-${{ matrix.target }}

      # --- controller-standalone (frontend only, no embedded services) ---
      - name: Build controller-standalone
        env:
          UPTRAKIT_RELEASE_NAME: uptrakit-controller-standalone
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-controller \
            --no-default-features \
            --features embed-frontend,db-all,oidc,nats,notifications-all,zeroconf,interactive,reset-data,dashboard-icons
          cp target/${{ matrix.target }}/release/uptrakit-controller uptrakit-controller-standalone-${{ env.TAG_NAME }}-${{ matrix.target }}

      # --- agent ---
      - name: Build agent
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-agent
          cp target/${{ matrix.target }}/release/uptrakit-agent uptrakit-agent-${{ env.TAG_NAME }}-${{ matrix.target }}

      # --- agent-ssh ---
      - name: Build agent-ssh
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-agent-ssh
          cp target/${{ matrix.target }}/release/uptrakit-agent-ssh uptrakit-agent-ssh-${{ env.TAG_NAME }}-${{ matrix.target }}

      # --- mqtt ---
      - name: Build mqtt
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-mqtt
          cp target/${{ matrix.target }}/release/uptrakit-mqtt uptrakit-mqtt-${{ env.TAG_NAME }}-${{ matrix.target }}

      # --- scheduler ---
      - name: Build scheduler
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-scheduler --no-default-features \
            --features db-all,oidc
          cp target/${{ matrix.target }}/release/uptrakit-scheduler uptrakit-scheduler-${{ env.TAG_NAME }}-${{ matrix.target }}

      # --- cli ---
      - name: Build cli
        run: |
          ${{ steps.cargo-cmd.outputs.cmd }} build --release --target ${{ matrix.target }} \
            -p uptrakit-cli
          cp target/${{ matrix.target }}/release/uptrakit uptrakit-cli-${{ env.TAG_NAME }}-${{ matrix.target }}

      # --- upload to release ---
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ env.TAG_NAME }}" \
            uptrakit-controller-${{ env.TAG_NAME }}-${{ matrix.target }} \
            uptrakit-controller-standalone-${{ env.TAG_NAME }}-${{ matrix.target }} \
            uptrakit-agent-${{ env.TAG_NAME }}-${{ matrix.target }} \
            uptrakit-agent-ssh-${{ env.TAG_NAME }}-${{ matrix.target }} \
            uptrakit-mqtt-${{ env.TAG_NAME }}-${{ matrix.target }} \
            uptrakit-scheduler-${{ env.TAG_NAME }}-${{ matrix.target }} \
            uptrakit-cli-${{ env.TAG_NAME }}-${{ matrix.target }}

      # --- attestation ---
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            uptrakit-controller-${{ env.TAG_NAME }}-${{ matrix.target }}
            uptrakit-controller-standalone-${{ env.TAG_NAME }}-${{ matrix.target }}
            uptrakit-agent-${{ env.TAG_NAME }}-${{ matrix.target }}
            uptrakit-agent-ssh-${{ env.TAG_NAME }}-${{ matrix.target }}
            uptrakit-mqtt-${{ env.TAG_NAME }}-${{ matrix.target }}
            uptrakit-scheduler-${{ env.TAG_NAME }}-${{ matrix.target }}
            uptrakit-cli-${{ env.TAG_NAME }}-${{ matrix.target }}
