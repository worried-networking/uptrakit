# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 20
    # These crates are deliberately pinned in the workspace Cargo.toml; bumping
    # them produces an un-buildable graph until upstream constraints lift. The
    # ignore ranges block the breaking bump while still allowing patches within
    # the pinned series. Revisit when the pin comments in Cargo.toml are removed.
    ignore:
      # der/const-oid/spki/x509-cert: blocked by openidconnect 4.x -> spki 0.7 chain
      - dependency-name: "der"
        versions: [">= 0.8"]
      - dependency-name: "spki"
        versions: [">= 0.8"]
      - dependency-name: "const-oid"
        versions: [">= 0.10"]
      - dependency-name: "x509-cert"
        versions: [">= 0.3"]
      # sha2/hmac/sha1: openidconnect 4.x hardcodes sha2 0.10.6
      - dependency-name: "sha2"
        versions: [">= 0.11"]
      - dependency-name: "hmac"
        versions: [">= 0.13"]
      - dependency-name: "sha1"
        versions: [">= 0.11"]
      # rand: testcontainers 0.27 -> bollard 0.20 -> rand 0.9
      - dependency-name: "rand"
        versions: [">= 0.10"]
    groups:
      crypto-provider:
        patterns:
          - "rustls"
          - "rustls-*"
          - "tokio-rustls"
          - "webpki-roots"
          - "rcgen"
          - "x509-*"
          - "der"
          - "spki"
          - "const-oid"
          - "aws-lc-rs"
          - "zeroize"
          - "subtle"
          - "sqlx"
          - "rumqttc"
          - "async-nats"
          - "axum-server"
          - "reqwest"
          - "testcontainers"
          - "testcontainers-modules"
          - "openidconnect"
      async-runtime:
        patterns:
          - "tokio"
          - "tokio-*"
          - "futures"
          - "futures-util"
          - "async-stream"
          - "async-trait"
          - "tungstenite"
      auth-identity:
        patterns:
          - "jsonwebtoken"
          - "argon2"
          - "totp-rs"
          - "hmac"
          - "sha1"
          - "sha2"
      serde-encoding:
        patterns:
          - "serde"
          - "serde_*"
          - "toml"
          - "base64"
          - "hex"
          - "percent-encoding"
      web-http:
        patterns:
          - "axum"
          - "axum-*"
          - "tower"
          - "tower-*"
          - "http"
          - "http-body-util"
          - "client-ip"
          - "rmcp"
      database:
        patterns:
          - "sea-orm"
          - "sea-orm-*"
      observability:
        patterns:
          - "tracing"
          - "tracing-*"
          - "metrics"
          - "metrics-*"
      openapi-schema:
        patterns:
          - "utoipa"
          - "utoipa-*"
          - "schemars"
      proc-macros:
        patterns:
          - "syn"
          - "quote"
          - "proc-macro2"
          - "strum"
          - "paste"
      ssh:
        patterns:
          - "russh"
          - "russh-*"
          - "ssh-key"
          - "ssh2-config"
      testing:
        patterns:
          - "httpmock"
          - "tracing-test"
          - "tempfile"
          - "husky-rs"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope