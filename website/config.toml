# Zola configuration. Reference: https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://uptrakit.org"
title = "Uptrakit"
description = "Self-hosted update tracking toolkit for Linux homelabs and small fleets. Manual updates only — you decide when."
default_language = "en"
output_dir = "public"
compile_sass = false
build_search_index = false
generate_feeds = false
minify_html = false

taxonomies = []

[extra]
github_repo_url = "https://github.com/worried-networking/uptrakit"

[markdown]
github_alerts = true

[link_checker]
skip_prefixes = [
    "https://t.me/",
]
skip_anchor_prefixes = [
    "https://docs.github.com/",
    # GitHub renders Markdown headings as id="user-content-<slug>", so an anchor
    # assertion can never match a #<slug> fragment on a github.com file page.
    # URL reachability is still checked; only the anchor lookup is skipped.
    "https://github.com/",
]
